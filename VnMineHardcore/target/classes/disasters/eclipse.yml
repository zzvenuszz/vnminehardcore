# ============================================================
# [ECLIPSE] 📉 NHẬT THỰC
# ============================================================
# [VI] Ban ngày thành đêm, quái xuất hiện. Chỉ xảy ra ban ngày.
# [EN] Day turns to night, mobs spawn. Only occurs during day.

disaster-id: eclipse
enabled: true
chance: 5
name: "§5§l📉 Nhật Thực"
# [VI] Mô tả tác động và gợi ý phòng tránh hiển thị trong chat; giá trị bên dưới là mặc định.
# [EN] Effect and prevention summary shown in chat; the value below is the default.
chat-description: "Thời gian Overworld chuyển về đêm, bóng tối bao phủ và quái xuất hiện ngoài trời. Ở trong nhà để tránh quái."
duration-seconds: 180
effect-interval-seconds: 10
warning-seconds: 120

conditions:
  only-night: false
  only-day: true
  worlds: ["overworld"]
  min-players-online: 1

start-title: "§5§l📉 Nhật Thực"
start-subtitle: "Mặt trời biến mất!"
start-sound: ENTITY_WITHER_SPAWN
start-sound-volume: 1.0
start-sound-pitch: 0.8

actions:
  - type: set_time
    time: 13000

  - type: potion_effect
    condition:
      require-outdoor: false
      ignore-safe-zone: true
    targets:
      all_players:
        weight: 100
    effects:
      - type: DARKNESS
        duration-ticks: 60
        amplifier: 2

  - type: spawn_mobs
    condition:
      require-outdoor: true
      ignore-safe-zone: false
    count-per-player: 1
    radius: 7
    targets:
      player:
        weight: 100
        worlds: ["overworld"]
    mobs:
      ZOMBIE:
        weight: 30
      SKELETON:
        weight: 30
      CREEPER:
        weight: 20
      SPIDER:
        weight: 20

  - type: action_bar
    condition:
      require-outdoor: false
      ignore-safe-zone: true
    targets:
      all_players:
        weight: 100
    message: "§5§l📉 Nhật thực! Bóng tối bao trùm!"

on-end:
  - type: set_time
    time: 1000
  - type: broadcast
    message: "§a📉 Nhật thực kết thúc."