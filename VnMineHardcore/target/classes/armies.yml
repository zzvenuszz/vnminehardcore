        amount: 5.0
        # [VI] Bán kính hồi; mặc định 8 block, hợp lệ 1-32.
        # [EN] Healing radius; default 8 blocks, valid range 1-32.
        radius-blocks: 8.0
      BUFF_OWNER:
        # [VI] Thời gian hồi; mặc định 30 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 30 seconds, valid range 1-3600.
        cooldown-seconds: 30
