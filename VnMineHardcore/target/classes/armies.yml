        # [EN] Health restored; default 4, valid range 0-100.
        amount: 4.0
        # [VI] Bán kính hồi; mặc định 10 block, hợp lệ 1-32.
        # [EN] Healing radius; default 10 blocks, valid range 1-32.
        radius-blocks: 10.0
      BUFF_ALLIES:
        # [VI] Cooldown tăng kháng cự; mặc định 45 giây, hợp lệ 1-3600.
        # [EN] Resistance buff cooldown; default 45 seconds, valid range 1-3600.
        cooldown-seconds: 45
        # [VI] Mục tiêu buff; OWNER, ALLIES hoặc OWNER_AND_ALLIES.
