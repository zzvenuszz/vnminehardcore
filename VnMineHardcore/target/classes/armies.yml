    # [EN] Short role description shown in the GUI.
    description: "Đỡ đòn, hồi máu, tăng kháng cự và lao giáo khi đang cưỡi ngựa."
    # [VI] Entity phải là quái vật có AI và cưỡi ngựa; mặc định ZOMBIE.
