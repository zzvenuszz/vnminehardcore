    gear-stats:
      # [VI] Bonus toàn set da 1 sao; HP +4, giáp +1, sát thương +4%, tầm +0.5 block, giảm hồi chiêu 2%.
      # [EN] Full leather 1-star set baseline; +4 HP, +1 armor, +4% damage, +0.5 range, 2% cooldown reduction.
      # [VI] HP nền cho set hoàn chỉnh; mặc định 4, hợp lệ 0-100.
      # [EN] Full-set base HP; default 4, valid 0-100.
      health: 4.0
      # [VI] Giáp nền cho set hoàn chỉnh; mặc định 1, hợp lệ 0-20.
      # [EN] Full-set base armor; default 1, valid 0-20.
      armor: 1.0
      # [VI] Sát thương đòn đánh; mặc định 4%, hợp lệ 0-100%.
      # [EN] Attack damage; default 4%, valid 0-100%.
      damage-percent: 4.0
      # [VI] Tầm đánh; mặc định 0.5 block, hợp lệ 0-10.
      # [EN] Attack range; default 0.5 blocks, valid 0-10.
      attack-range-blocks: 0.5
