    # [EN] GUI icon; default IRON_SPEAR.
    menu-icon: IRON_SPEAR
    # [VI] Bộ skill đỡ đòn, tấn công, hỗ trợ và lao giáo khi cưỡi ngựa.
    # [EN] Tank, attack, support, and mounted lance charge.
    skills: [ATTACK, SHIELD_OWNER, HEAL_ALLIES, BUFF_ALLIES, POWER_STRIKE, LANCE_CHARGE]
    # [VI] Giáo gỗ mặc định nếu kho không có giáo; STICK là fallback khi server chưa hỗ trợ giáo gỗ.
    # [EN] Default wooden spear when inventory has no spear; STICK fallback on servers without wooden spears.
    starting-weapon: WOODEN_SPEAR
    # [VI] Ưu tiên giáo sắt rồi giáo gỗ trong kho; chỉ dùng vật liệu có hỗ trợ.
    # [EN] Prefer iron then wooden spears from inventory; only use supported materials.
    preferred-main-hand-items: [IRON_SPEAR, WOODEN_SPEAR]
