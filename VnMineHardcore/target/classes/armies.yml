        target: OWNER_AND_ALLIES
        # [VI] Hiệu ứng hợp lệ trong Bukkit; mặc định RESISTANCE.
        # [EN] Bukkit potion effect; default RESISTANCE.
        effect: RESISTANCE
        # [VI] Thời lượng; mặc định 8 giây, hợp lệ 1-600.
