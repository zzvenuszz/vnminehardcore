      # [EN] Cooldown reduction; default 2%, valid 0-100%.
      cooldown-reduction-percent: 2.0
    # [VI] Máu tối đa của ngựa Kỵ sĩ; mặc định 50 HP, hợp lệ 1-1024.
    # [EN] Maximum health of the Paladin's horse; default 50 HP, valid range 1-1024.
    horse-health: 50.0
    # [VI] Tốc độ di chuyển của ngựa; mặc định 0.3375 (mức phi nước đại tối đa), hợp lệ 0.1-1.0.
    # [EN] Horse movement speed; default 0.3375 (maximum gallop speed), valid range 0.1-1.0.
    horse-speed: 0.3375
    # [VI] Máu thêm mỗi cấp; mặc định 5, không âm.
    # [EN] Health per level; default 5, must be nonnegative.
    health-per-level: 5
    # [VI] Sát thương cơ bản; mặc định 6, không âm.
    # [EN] Base damage; default 6, must be nonnegative.
    base-damage: 6
    # [VI] Giáp ban đầu; mặc định 4, hợp lệ 0-100.
    # [EN] Starting armor; default 4, valid range 0-100.
    base-armor: 4
    # [VI] Giáp tăng mỗi cấp; mặc định 0.3, không âm.
    # [EN] Armor per level; default 0.3, must be nonnegative.
    armor-per-level: 0.3
    # [VI] Sát thương tăng mỗi cấp; mặc định 0.6, không âm.
    # [EN] Damage per level; default 0.6, must be nonnegative.
    damage-per-level: 0.6
