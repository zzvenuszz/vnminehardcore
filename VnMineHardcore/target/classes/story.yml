# [VI] Vũ trụ truyện chung cho các di vật boss; mở rộng bằng artifact ID mới.
# [EN] Shared boss-relic story universe; add new entries with a unique artifact ID.
universe:
  title: "Biên Niên Rạn Nứt"
  premise: "Một vết nứt cổ kết nối các lãnh địa boss; mỗi di vật lưu lại manh mối cho chương kế tiếp."
  # [VI] Danh sách câu chuyện cũ được giữ lại; chapter có ID ổn định nằm trong story/chapters.yml.
  # [EN] Legacy story text is retained; stable-ID chapters are defined in story/chapters.yml.
  chapters:
    - "Creeper đánh thức Cổng Vạn Giới bằng Lôi Tâm."
    - "Địa Mạch Cự Nhân làm rung đường tơ Hoàng Hôn."
    - "Nhện dẫn người đọc tới Trăng Máu và Mật Lục."
    - "Cung Vạn Cốt hé lộ cuộc chiến của Kỵ Binh."
    - "Rìu Đỏ chôn lời phán trong Mộ Sâu."
    - "Ghast Than Khóc mở màn Vĩnh Dạ."
    - "Phantom chỉ đường tới Mắt Tận Cùng."
    - "Long Kiếm gom di vật, đối đầu Wither."
    - "Cổng còn thức, mở lối cho chương tiếp theo."

artifacts:
  creeper-relic:
    boss: creeper_boss
    item: "Lôi Tâm Hủy Diệt"
    lore:
      - "§7Kiếm lõi tích điện sét."
      - "§8Mỗi nhát truyền lôi lực."
      - "§8Creeper cổ canh giữ nó."
      - "§dSấm gọi Địa Mạch thức giấc."
  creeper-codex:
    boss: creeper_boss
    item: "Mật Lục Lôi Tâm Hủy Diệt"
    lore:
      - "§7Ghi cách tôi Lôi Tâm."
      - "§8Nêu cách dồn điện tích."
      - "§8Chữ cháy từ hang Creeper."
      - "§dSơ đồ dẫn tới Địa Mạch."
  giant-relic:
    boss: giant_boss
    item: "Rìu Địa Mạch Cự Nhân"
    lore:
      - "§7Rìu đúc từ quặng Địa Mạch."
      - "§8Trọng lượng dồn lực chấn."
      - "§8Cự Nhân giữ dưới thành cổ."
      - "§dĐịa chấn gọi đàn Nhện."
  giant-codex:
    boss: giant_boss
    item: "Mật Lục Địa Mạch Cự Nhân"
    lore:
      - "§7Bản vẽ rìu của Cự Nhân."
      - "§8Chỉ cách dồn lực vào cán."
      - "§8Đá vụn phủ trang sách."
      - "§dDấu mực dẫn tới ổ Nhện."
  spider-relic:
    boss: spider_boss
    item: "Ủng Tơ Độc Hoàng Hôn"
    lore:
      - "§7Ủng bện từ tơ độc cổ."
      - "§8Đế bám vách, tránh bẫy tơ."
      - "§8Nhện Hoàng Hôn canh giữ."
      - "§dTơ tím chỉ về Trăng Máu."
  spider-codex:
    boss: spider_boss
    item: "Mật Lục Tơ Độc Hoàng Hôn"
    lore:
      - "§7Sơ đồ dệt tơ gia cố."
      - "§8Ghi cách chống nọc độc."
      - "§8Mật mã thuộc ổ Hoàng Hôn."
      - "§dDẫn tới lều Phù Thủy."
