# [VI] Phiên bản cấu trúc quest; mặc định 1, chỉ hỗ trợ phiên bản 1.
# [EN] Quest schema version; defaults to 1 and only version 1 is supported.
schema-version: 1

quest:
  # [VI] Bật/tắt quest hướng dẫn; mặc định true.
  # [EN] Enable/disable the tutorial quest; defaults to true.
  enabled: true

  # [VI] ID ổn định dùng trong SQLite; mặc định first-steps, không đổi sau khi đã phát hành.
  # [EN] Stable SQLite quest ID; defaults to first-steps and should not change after release.
  id: first-steps

  # [VI] Tên quest hiển thị cho người chơi; mặc định Bước chân đầu tiên, không để trống.
  # [EN] Quest title shown to players; defaults to First Steps and must not be blank.
  title: "Bước chân đầu tiên"

  # [VI] Mô tả ngắn mục đích quest; mặc định hướng dẫn người chơi tìm điểm an toàn.
  # [EN] Short quest description; defaults to guiding players to the safe arrival point.
  description: "Hãy tìm NPC Tutorial tại đại lục bạn đã chọn để bắt đầu hành trình."

  reward:
    # [VI] Loại thưởng: character-exp (XP RPG) hoặc vncoin; mặc định character-exp.
    # [EN] Reward type: character-exp (RPG XP) or vncoin; defaults to character-exp.
    type: character-exp

    # [VI] Số thưởng khi hoàn thành; character-exp hợp lệ 0..100000, vncoin hợp lệ 1..1000000.
    # [EN] Completion reward amount; character-exp allows 0..100000, vncoin allows 1..1000000.
    amount: 25

  objective:
    # [VI] ID objective phải ổn định để giữ tiến trình; mặc định reach-human-realm-spawn.
    # [EN] Stable objective ID used to resume progress; defaults to reach-human-realm-spawn.
    id: reach-human-realm-spawn

    # [VI] Mục tiêu đến NPC Tutorial của realm đã chọn; visit-realm-spawn cũ vẫn được đọc tương thích.
    # [EN] Visit the selected realm's Tutorial NPC; legacy visit-realm-spawn remains readable.
    type: visit-tutorial-npc

    # [VI] Realm dự phòng; mặc định human-realm. Người chơi mới tự được dẫn tới realm có world khớp homeWorld đã chọn.
    # [EN] Fallback realm; defaults to human-realm. New players are routed to the realm matching their selected homeWorld.
    realm-id: human-realm

    # [VI] Bán kính để tính đã tới spawn; mặc định 8 block, giới hạn 1..64.
    # [EN] Radius that counts as reaching the spawn; defaults to 8 blocks, valid range 1..64.
    radius-blocks: 8

    # [VI] Bật/tắt tracking particle cấp server cho quest; người chơi có thể tự tắt trong GUI, mặc định bật.
    # [EN] Master switch for quest tracking particles; players may toggle them in the GUI, defaults to true.
    waypoint-enabled: true

    # [VI] Trạng thái tracking ban đầu cho người chưa lưu lựa chọn; mặc định bật.
    # [EN] Initial tracking state for players without a saved choice; defaults to enabled.
    tracking-enabled-by-default: true

    # [VI] Vẽ vòng marker xanh sáng và cột particle tại đích; mặc định bật.
    # [EN] Draw a bright green ring and particle beam at the destination; defaults to enabled.
    target-marker-enabled: true

    # [VI] Khoảng cập nhật đường tracking; mặc định 20 tick, giới hạn 5..200 tick.
    # [EN] Tracking path update interval; defaults to 20 ticks, valid range 5..200 ticks.
    waypoint-update-interval-ticks: 20

    # [VI] Tầm tối đa vẽ particle; mặc định 48 block, giới hạn 8..64 block.
    # [EN] Maximum distance for drawing particles; defaults to 48 blocks, valid range 8..64 blocks.
    waypoint-particle-range-blocks: 48

    # [VI] Hướng dẫn khi quest bắt đầu; người chơi chọn realm bằng /start rồi tìm NPC Tutorial.
    # [EN] Quest guidance; players choose a realm with /start and find its Tutorial NPC.
    start-message: "Dùng /start để chọn đại lục, sau đó gặp NPC Tutorial tại đó."

    # [VI] Thông báo khi objective hoàn tất; mặc định xác nhận đã gặp NPC Tutorial.
    # [EN] Completion feedback; defaults to confirming the Tutorial NPC visit.
    complete-message: "Bạn đã gặp NPC Tutorial. Tiến trình đã được lưu."
