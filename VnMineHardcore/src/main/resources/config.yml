# ============================================================
# ================== VnMineHardcore v1.8.0 ==================
# ==================   CẤU HÌNH / CONFIG   ==================
# ============================================================
# [VI] File cấu hình chính của plugin VnMineHardcore.
#      Tất cả các thông số đều có thể thay đổi và có giá trị mặc định.
# [EN] Main configuration file for VnMineHardcore plugin.
#      All parameters can be changed and have default values.
# ============================================================
config-version: 2

# [VI] Cấu hình GUI quản trị người chơi; quyền lệnh vẫn được kiểm soát bằng permission.
# [EN] Player administration GUI settings; command access is still controlled by permissions.
player-admin:
  # [VI] Bật/tắt lệnh và GUI quản trị người chơi; mặc định bật.
  # [EN] Enable or disable the player administration command and GUI; defaults to true.
  enabled: true
  # [VI] Giới hạn số inventory tử vong hiển thị để khôi phục; mặc định 10, hợp lệ 1-10.
  # [EN] Maximum recent death inventories shown for restoration; defaults to 10, valid range 1-10.
  death-snapshot-limit: 10
  mute:
    # [VI] Số giây mute tối đa admin có thể nhập; mặc định 31536000, hợp lệ 1-31536000.
    # [EN] Maximum mute duration an admin can enter in seconds; defaults to 31536000, valid range 1-31536000.
    max-seconds: 31536000

# [VI] Menu tổng hợp và phím mở menu; mặc định bật, F sẽ mở menu thay vì đổi tay phụ.
# [EN] Main menu and its hotkey; enabled by default, F opens the menu instead of swapping hands.
menus:
  # [VI] Menu chính; mặc định bật.
  # [EN] Main menu; default enabled.
  main:
    enabled: true
    # [VI] Chặn sự kiện đổi tay bằng phím F để mở menu; mặc định bật.
    # [EN] Cancel the F-key hand-swap event to open the menu; default enabled.
    intercept-f-key: true
  # [VI] Hiển thị mục menu admin cho người có quyền; mặc định bật.
  # [EN] Show admin menu to players with permission; default enabled.
  admin:
    enabled: true
    # [VI] Bật công cụ RPG cấp sách kỹ năng/EXP/level trong menu admin; mặc định bật.
    # [EN] Enable admin RPG tools for granting skill books/experience/levels; defaults to true.
    rpg-tools:
      enabled: true
    # [VI] Thời gian cảnh báo trước khi gọi thiên tai/boss; mặc định 30 giây, hợp lệ 1-3600.
    # [EN] Warning time before a disaster/boss is summoned; default 30 seconds, valid range 1-3600.
    warning-seconds: 30
    # [VI] Thời gian thiên tai/boss hoạt động; mặc định 120 giây, hợp lệ 1-86400.
    # [EN] Disaster/boss active duration; default 120 seconds, valid range 1-86400.
    duration-seconds: 120

# [VI] Giới hạn và hiệu năng cho Schema Build; các giá trị áp dụng khi dựng/hiển thị preview.
# [EN] Schema Build safety and performance limits; values apply while placing/rendering previews.
schema-build:
  # [VI] Số block tối đa trong một file Sponge .schem (mặc định 400000, hợp lệ 1-500000).
  # [EN] Maximum blocks in one Sponge .schem file (default 400000, valid 1-500000).
  max-blocks: 400000
  # [VI] Số BlockDisplay tối đa trong preview; schema lớn hơn vẫn dựng đầy đủ nhưng preview bị rút gọn (mặc định 1200, hợp lệ 1-5000).
  # [EN] Maximum BlockDisplay entities in preview; larger schemas still place fully but preview is truncated (default 1200, valid 1-5000).
  preview-blocks: 1200
  # [VI] Số lần dựng có thể Undo mỗi admin (mặc định 10, hợp lệ 1-50; chỉ lưu trong phiên server hiện tại).
  # [EN] Number of builds each admin can undo (default 10, valid 1-50; session-only, not persisted across restarts).
  history-size: 10

# [VI] Giới hạn an toàn cho lệnh chỉnh sửa vùng //set, //replace, //paste... của búa WorldEdit tích hợp.
# [EN] Safety limits for integrated selection-wand editing commands such as //set, //replace, and //paste.
worldedit:
  # [VI] Số block thay đổi tối đa cho một thao tác; mặc định 32768, hợp lệ 1-250000.
  # [EN] Maximum changed blocks per operation; defaults to 32768, valid range 1-250000.
  max-blocks: 32768
  # [VI] Số block áp dụng mỗi tick để giảm giật server; mặc định 512, hợp lệ 32-4096.
  # [EN] Blocks applied each tick to reduce server stalls; defaults to 512, valid range 32-4096.
  blocks-per-tick: 512
  # [VI] Số chunk tối đa được giữ nạp cho một thao tác; mặc định 256, hợp lệ 1-2048.
  # [EN] Maximum chunks kept loaded during one operation; defaults to 256, valid range 1-2048.
  max-chunks-per-operation: 256
  # [VI] Số thao tác có thể undo; history chỉ tồn tại trong phiên người chơi/server, mặc định 10, hợp lệ 1-50.
  # [EN] Number of undoable operations; history is session-only, defaults to 10, valid range 1-50.
  history-size: 10

# [VI] Cài đặt tạo nhân vật RPG; mặc định được bật.
# [EN] RPG character-creation settings; enabled by default.
rpg:
  onboarding:
    # [VI] Bật flow chọn đại lục và gặp NPC tutorial trước khi tạo nhân vật; mặc định true.
    # [EN] Require continent selection and a tutorial NPC visit before character creation; defaults to true.
    enabled: true
    # [VI] World an toàn để người chơi reset quest/tân thủ bắt đầu trước khi chọn đại lục.
    # [EN] Safe world for new/reset players before they choose a realm.
    start-world:
      # [VI] Tên world bắt đầu; mặc định world_start, chỉ nhận tên không có dấu phân cách thư mục.
      # [EN] Start-world name; defaults to world_start and cannot contain path separators.
      name: world_start
      # [VI] Tạo/nạp và quản lý world lúc plugin khởi động; environment/seed đổi sẽ archive world cũ.
      # [EN] Create/load and manage the world at plugin startup; environment/seed changes archive the old world.
      create-if-missing: true
      # [VI] Môi trường world: NORMAL, NETHER hoặc THE_END; mặc định NORMAL.
      # [EN] World environment: NORMAL, NETHER, or THE_END; defaults to NORMAL.
      environment: NORMAL
      # [VI] Số thế hệ cấu hình do /vninit tăng khi đổi môi trường; không chỉnh tay.
      # [EN] Configuration generation incremented by /vninit on environment changes; do not edit manually.
      world-revision: 0
      # [VI] Công tắc chung cho chặn đặt/phá và tương tác trong start-world; mặc định bật.
      # [EN] Master protection switch for block placement/breaking and interactions in the start world; defaults to true.
      protection:
        enabled: true
        # [VI] Chặn người chơi thường phá block; mặc định bật.
        # [EN] Prevent regular players from breaking blocks; defaults to true.
        block-break: true
        # [VI] Chặn người chơi thường đặt block; mặc định bật.
        # [EN] Prevent regular players from placing blocks; defaults to true.
        block-place: true
        # [VI] Chặn tương tác rương/cửa/nút và block; mặc định bật.
        # [EN] Prevent chest/door/button and block interactions; defaults to true.
        interactions: true
      # [VI] Cho phép PvP trong start-world; mặc định tắt.
      # [EN] Allow PvP in the start world; defaults to false.
      pvp-enabled: false
      # [VI] Cho phép sinh quái tự nhiên/spawner; mặc định tắt.
      # [EN] Allow natural and spawner mob spawning; defaults to false.
      mob-spawning-enabled: false
      # [VI] Cho phép chu kỳ ngày đêm; mặc định tắt.
      # [EN] Allow the day/night cycle; defaults to false.
      time-passes: false
      # [VI] Cho phép tiêu hao thanh đói trong start-world; mặc định tắt.
      # [EN] Allow hunger drain in the start world; defaults to false.
      hunger-drain-enabled: false
      # [VI] Cho phép tiêu hao thanh khát trong start-world; mặc định tắt.
      # [EN] Allow thirst drain in the start world; defaults to false.
      thirst-drain-enabled: false
      # [VI] Seed tùy chọn 64-bit; bỏ trống để giữ seed hiện có, xóa seed đã dùng sẽ backup và tạo lại world với seed tự sinh.
      # [EN] Optional 64-bit seed; omit to keep the current seed; clearing a configured seed backs up and regenerates the world.
      # seed: 123456789
      # [VI] ID NPC loại tutorial đặt trong world bắt đầu/reset; có thể chọn trực tiếp trong /vninit.
      # [EN] ID of a tutorial-type NPC in the start/reset world; select it directly in /vninit.
      tutorial-npc-id: ""
      tutorial:
        # [VI] Dialog phát khi người chơi tương tác NPC tutorial world bắt đầu; chọn bằng /vninit hoặc edit NPC.
        # [EN] Dialog played when a player interacts with the start-world tutorial NPC; set via /vninit or NPC editor.
        dialog-id: ""
        # [VI] Quest tự giao sau dialog; chỉ quest có giver NPC ID trùng với tutorial-npc-id mới được chọn.
        # [EN] Quest accepted after the dialog; only quests whose giver NPC ID matches tutorial-npc-id are selectable.
        auto-quest-id: ""
    # [VI] Vẽ đường particle navigation khi người chơi cùng world với NPC; mặc định true.
    # [EN] Render navigation particles when the player is in the NPC's world; defaults to true.
    navigation-enabled: true
    # [VI] Chu kỳ cập nhật navigation tính bằng tick; mặc định 20, giới hạn 10..100.
    # [EN] Navigation refresh interval in ticks; defaults to 20, valid range 10..100.
    navigation-interval-ticks: 20
    # [VI] Khoảng cách particle tối đa; mặc định 48 block, giới hạn 8..64.
    # [EN] Maximum particle rendering distance; defaults to 48 blocks, valid range 8..64.
    navigation-range-blocks: 48
  progression:
    # [VI] Cấp nhân vật tối đa; mặc định 30, hợp lệ 2-100.
    # [EN] Maximum character level; defaults to 30, valid range 2-100.
    max-level: 30
    # [VI] EXP cần để đi từ cấp 1 lên cấp 2; mặc định 100, hợp lệ 1-1000000.
    # [EN] Experience required to advance from level 1 to level 2; defaults to 100, valid range 1-1000000.
    base-experience: 100
    # [VI] Lượng EXP tăng thêm cho mỗi cấp kế tiếp; mặc định 50, hợp lệ 0-1000000.
    # [EN] Additional experience required per subsequent level; defaults to 50, valid range 0-1000000.
    experience-per-level: 50
    # [VI] Skill point nhận được mỗi lần lên cấp; mặc định 1, hợp lệ 0-10.
    # [EN] Skill points awarded for each level gained; defaults to 1, valid range 0-10.
    skill-points-per-level: 1
  skills:
    mana:
      # [VI] Mana tối đa của nhân vật; mặc định 100, hợp lệ 1-1000.
      # [EN] Maximum character mana; defaults to 100, valid range 1-1000.
      max-mana: 100
      # [VI] Mana hồi mỗi giây; mặc định 1, hợp lệ 0-100.
      # [EN] Mana regenerated per second; defaults to 1, valid range 0-100.
      regeneration-per-second: 1
    passives:
      battle-focus:
        # [VI] Sát thương đánh thường cộng thêm cho mỗi rank của Tâm Kiếm; mặc định 0.03 (3%), hợp lệ 0-0.10 (0-10%).
        # [EN] Extra direct melee damage per Battle Focus rank; defaults to 0.03 (3%), valid range 0-0.10 (0-10%).
        damage-bonus-per-rank: 0.03
      fortify:
        # [VI] Giảm sát thương mỗi stack cho mỗi rank Thành Đồng; mặc định 0.02 (2%), hợp lệ 0-0.05 (0-5%).
        # [EN] Damage reduction per Fortify stack per rank; defaults to 0.02 (2%), valid range 0-0.05 (0-5%).
        damage-reduction-per-stack-per-rank: 0.02
        # [VI] Số stack Thành Đồng tối đa; mặc định 3, hợp lệ 1-3.
        # [EN] Maximum Fortify stacks; defaults to 3, valid range 1-3.
        max-stacks: 3
        # [VI] Số giây không bị quái đánh trước khi stack bị xóa; mặc định 5, hợp lệ 1-30.
        # [EN] Seconds without a hostile-mob hit before stacks expire; defaults to 5, valid range 1-30.
        stack-duration-seconds: 5
      mana-flow:
        # [VI] Mana hồi thêm mỗi rank sau cast thành công thứ hai trở đi trong chuỗi; mặc định 1, hợp lệ 0-10.
        # [EN] Mana restored per rank on each successful follow-up cast in a chain; defaults to 1, valid range 0-10.
        mana-per-chain-cast-per-rank: 1
        # [VI] Thời gian tối đa giữa hai cast thành công để nối chuỗi; mặc định 5 giây, hợp lệ 1-30.
        # [EN] Maximum gap between successful casts to continue a chain; defaults to 5 seconds, valid range 1-30.
        chain-window-seconds: 5
    quick-cast:
      # [VI] Bật giao diện quick cast; mặc định true.
      # [EN] Enable the quick-cast menu; defaults to true.
      enabled: true
      # [VI] Dùng phím Q để mở menu; mặc định true. Q trên ô đồ bị chặn thả, còn kéo item ra ngoài bằng chuột vẫn thả bình thường.
      # [EN] Use the Q key to open the menu; defaults to true. Q drops are intercepted, while mouse drops outside remain normal.
      intercept-drop-key: true
  character-creation:
    # [VI] Bật/tắt mục tạo nhân vật trong menu và việc mở GUI; mặc định true.
    # [EN] Enable/disable the character-creation menu entry and GUI; default true.
    enabled: true
  quest-journal:
    # [VI] Bật/tắt mục nhật ký nhiệm vụ trong menu chính; mặc định true.
    # [EN] Enable/disable the quest journal entry in the main menu; default true.
    enabled: true
  quests:
    tracking:
      # [VI] Bật particle dẫn đường tới NPC của quest đang theo dõi; mặc định true.
      # [EN] Enable waypoint particles toward the tracked quest giver NPC; defaults to true.
      particle-enabled: true
      # [VI] Chu kỳ cập nhật đường particle, tính bằng tick; hợp lệ 5-40, mặc định 10.
      # [EN] Waypoint particle update interval in ticks; valid range 5-40, defaults to 10.
      update-interval-ticks: 10
  npc:
    # [VI] Số NPC runtime tối đa có thể quản lý; mặc định 100, hợp lệ 1-100.
    # [EN] Maximum number of managed runtime NPCs; defaults to 100, valid range 1-100.
    max-runtime-npcs: 100
    # [VI] Cho NPC tự quay về người chơi gần nhất cùng world; mặc định bật.
    # [EN] Make managed NPCs turn toward the nearest player in the same world; enabled by default.
    look-at:
      enabled: true
      # [VI] Khoảng cách tối đa để NPC chọn người chơi, tính bằng block; mặc định 16, hợp lệ 1-64.
      # [EN] Maximum player distance for NPC facing, in blocks; defaults to 16, valid range 1-64.
      range-blocks: 16
    # [VI] Hiển thị NPC bằng mô hình player giả lập; vai trò merchant/quest/story/tutorial vẫn giữ nguyên.
    # [EN] Render managed NPCs as packet-based player models; merchant/quest/story/tutorial roles remain unchanged.
    player-model:
      # [VI] Bật mô hình player cho NPC; mặc định true. Khi tắt, NPC hiện lại dưới dạng villager.
      # [EN] Enable player models for NPCs; defaults to true. When disabled, NPCs appear as villagers again.
      enabled: true
      # [VI] Tầm gửi mô hình player tới người chơi tính theo block; mặc định 48, hợp lệ 8-128.
      # [EN] Distance in blocks for sending player models to viewers; defaults to 48, valid range 8-128.
      view-distance-blocks: 48
    markers:
      # [VI] Bật dấu quest/story riêng theo từng người chơi trên đầu NPC; mặc định true.
      # [EN] Enable per-player quest/story markers above NPCs; defaults to true.
      enabled: true
      # [VI] Chu kỳ đối chiếu marker (tick); mặc định 20, hợp lệ 5-100.
      # [EN] Marker reconciliation interval (ticks); default 20, valid range 5-100.
      update-interval-ticks: 20
      # [VI] Tầm hiển thị marker tính theo block; mặc định 48, hợp lệ 8-128.
      # [EN] Marker visibility range in blocks; default 48, valid range 8-128.
      tracking-range-blocks: 48
  text-display:
    # [VI] Số text display quản lý tối đa; mặc định 100, hợp lệ 1-500.
    # [EN] Maximum number of managed text displays; defaults to 100, valid range 1-500.
    max-active: 100
  world-map:
    # [VI] Bật/tắt mục Bản đồ đại lục trong menu chính; mặc định true.
    # [EN] Enable/disable the continent map entry in the main menu; default true.
    enabled: true
  portal-travel:
    # [VI] Bật/tắt dịch chuyển qua bản đồ; mặc định true.
    # [EN] Enable/disable travel through the map; default true.
    enabled: true
    # [VI] Chặn dịch chuyển khi combat tag còn hiệu lực; mặc định true.
    # [EN] Block travel while the combat tag is active; default true.
    block-in-combat: true
  portals:
    # [VI] Bật/tắt portal do quản trị viên tạo; mặc định true.
    # [EN] Enable/disable administrator-created portals; defaults to true.
    enabled: true
    # [VI] Số portal tối đa; mặc định 100, hợp lệ 1-500.
    # [EN] Maximum portal count; defaults to 100, valid range 1-500.
    max-portals: 100
    # [VI] Số block tối đa trong vùng portal; mặc định 20000, hợp lệ 1-250000.
    # [EN] Maximum blocks in a portal selection; defaults to 20000, valid range 1-250000.
    max-selection-blocks: 20000
    # [VI] Thời gian chờ giữa các lần dịch chuyển portal (giây); mặc định 3, hợp lệ 0-300.
    # [EN] Cooldown between portal travels (seconds); defaults to 3, valid range 0-300.
    travel-cooldown-seconds: 3
    particle-ring:
      # [VI] Hiển thị vòng particle đánh dấu tâm portal; mặc định true.
      # [EN] Show a particle ring marking each portal center; defaults to true.
      enabled: true
  profile-database:
    # [VI] Số giờ giữa các lần sao lưu SQLite tự động; mặc định 6 giờ, hợp lệ 1-168.
    # [EN] Hours between automatic SQLite backups; default 6 hours, valid range 1-168.
    backup-interval-hours: 6
    # [VI] Số bản sao lưu gần nhất cần giữ; mặc định 12, hợp lệ 1-100.
    # [EN] Number of recent database backups to retain; default 12, valid range 1-100.
    backup-retention-count: 12
    # [VI] Số lần thử lại thêm khi SQLite tạm bận; mặc định 2, hợp lệ 0-3.
    # [EN] Additional retries when SQLite is temporarily busy; default 2, valid range 0-3.
    write-retries: 2
    # [VI] Thời gian nghỉ giữa các lần thử ghi lại (ms); mặc định 50 ms, hợp lệ 10-250.
    # [EN] Delay between write retries (ms); default 50 ms, valid range 10-250.
    write-retry-delay-ms: 50

# ============================================================
# [DEATH] ☠ TỬ THẦN / DEATH
# ============================================================
death:
  # [VI] Thông báo cái chết cho toàn bộ server
  # [EN] Broadcast death message to all players
  broadcast-death: true

  # [VI] Phát âm thanh wither death khi có người chết
  # [EN] Play wither death sound when a player dies
  play-sound: true

  history:
    # [VI] Số snapshot inventory chết lưu tối đa cho mỗi người chơi; mặc định 10, hợp lệ 1-10.
    # [EN] Maximum death inventory snapshots retained per player; default 10, valid range 1-10.
    max-records-per-player: 10

  # [VI] Bảo vệ người chơi trong thời gian ngắn sau khi họ chọn hồi sinh.
  #     Màn hình chết vẫn cho phép chọn hồi sinh hoặc thoát game.
  # [EN] Protect players briefly after they choose to respawn.
  #     The death screen still lets players choose to respawn or leave the game.
  respawn-protection:
    # [VI] Bật/tắt thời gian chờ hồi sinh và giới hạn tương tác/di chuyển.
    # [EN] Enable/disable the respawn delay and movement/interaction restrictions.
    enabled: true

    # [VI] Số giây chờ trước khi người chơi hồi sinh hoàn toàn và có thể tương tác.
    #     Đặt 0 để bỏ qua thời gian chờ.
    # [EN] Seconds before the player fully respawns and can interact.
    #     Set to 0 to skip the delay.
    delay-seconds: 10

    # [VI] Bán kính di chuyển tối đa tính từ vị trí hồi sinh trong thời gian chờ.
    #     Đơn vị block; đặt 0 để giữ người chơi tại chỗ.
    # [EN] Maximum movement radius from the respawn location during the delay.
    #     Measured in blocks; set to 0 to keep the player at the respawn point.
    movement-radius-blocks: 10

    # [VI] Thời gian miễn nhiễm mọi sát thương sau khi hồi sinh (giây).
    #     Đặt 0 để tắt miễn nhiễm sau khi hồi sinh.
    # [EN] Duration of immunity to all damage after respawning (seconds).
    #     Set to 0 to disable post-respawn immunity.
    damage-immunity-seconds: 10

# ============================================================
# [DEATH PENALTY] 💀 HÌNH PHẠT KHI CHẾT / DEATH PENALTY
# ============================================================
death-penalty:
  # [VI] Bật hệ thống hình phạt khi chết (giảm chỉ số)
  # [EN] Enable death penalty system (stat reduction)
  enabled: true

  # [VI] Thời gian sống sót sau khi hồi sinh để phục hồi chỉ số (giây)
  #     Nếu người chơi sống sót đủ thời gian này, penalty sẽ được gỡ bỏ
  # [EN] Survival time after respawn to recover stats (seconds)
  #     If the player survives this long, the penalty is removed
  recovery-seconds: 300

  # [VI] Số lần chết tối đa có thể tích lũy penalty (giới hạn trên)
  #     Giúp tránh penalty quá lớn sau nhiều lần chết liên tiếp
  # [EN] Maximum death count that accumulates penalty (upper limit)
  #     Prevents penalty from becoming too large after many consecutive deaths
  max-penalty-stack: 5

  # [VI] Phần trăm giảm chỉ số MỖI LẦN CHẾT (số thập phân, 0.1 = 10%)
  #     Ví dụ: 0.1 = mỗi lần chết giảm 10% chỉ số tương ứng
  # [EN] Percent stat reduction PER DEATH (decimal, 0.1 = 10%)
  #     Example: 0.1 = each death reduces the corresponding stat by 10%
  stats:
    # [VI] % giảm HP tối đa mỗi lần chết
    # [EN] % max HP reduction per death
    max-hp-per-death: 0.1

    # [VI] % giảm max thirst offset mỗi lần chết
    # [EN] % max thirst offset reduction per death
    max-thirst-per-death: 0.1

    # [VI] % giảm sát thương gây ra mỗi lần chết
    # [EN] % damage dealt reduction per death
    damage-per-death: 0.1

    # [VI] % tăng sát thương nhận vào mỗi lần chết
    # [EN] % incoming damage increase per death
    incoming-damage-per-death: 0.1

    # [VI] % giảm hồi phục mỗi lần chết
    # [EN] % regen reduction per death
    regen-per-death: 0.1

    # [VI] % tăng tốc mất thức ăn mỗi lần chết
    # [EN] % food drain increase per death
    food-drain-per-death: 0.1

    # [VI] % tăng tốc mất khát mỗi lần chết
    # [EN] % thirst drain increase per death
    thirst-drain-per-death: 0.1

# ============================================================
# [COMBAT] ⚔ CHIẾN ĐẤU / COMBAT
# ============================================================
combat:
  # ===== SÁT THƯƠNG / DAMAGE MULTIPLIERS =====
  # [VI] Hệ số nhân sát thương từ quái vật (1.0 = bình thường)
  # [EN] Damage multiplier from mobs (1.0 = normal)
  mob-damage-multiplier: 2.0

  # [VI] Hệ số nhân sát thương ngã (1.0 = bình thường)
  # [EN] Fall damage multiplier (1.0 = normal)
  fall-damage-multiplier: 2.0

  # [VI] Hệ số nhân sát thương lửa / dung nham (1.0 = bình thường)
  # [EN] Fire/lava damage multiplier (1.0 = normal)
  fire-damage-multiplier: 2.0

  # [VI] Hệ số nhân sát thương chết đuối (1.0 = bình thường)
  # [EN] Drowning damage multiplier (1.0 = normal)
  drowning-damage-multiplier: 2.0

  # [VI] Hệ số nhân sát thương nổ (1.0 = bình thường)
  # [EN] Explosion damage multiplier (1.0 = normal)
  explosion-damage-multiplier: 1.5

  # [VI] Hệ số nhân sát thương PvP (1.0 = bình thường)
  # [EN] PvP damage multiplier (1.0 = normal)
  pvp-damage-multiplier: 1.25

  # ===== QUÁI VẬT / MOB STATS =====
  # [VI] Hệ số nhân máu tối đa của quái vật (1.0 = bình thường)
  # [EN] Extra max health multiplier for mobs (1.0 = normal)
  mob-extra-hp-multiplier: 1.5

  # ===== HỒI PHỤC MÁU / HEALTH REGENERATION =====
  # [VI] Tắt hoàn toàn hồi phục máu tự nhiên (true = tắt, false = bật)
  # [EN] Completely disable natural health regeneration (true = off, false = on)
  disable-natural-regen: false

  # [VI] Hệ số hồi phục máu (chỉ dùng khi disable-natural-regen: false)
  #     1.0 = hồi phục như vanilla, 0.5 = hồi 50%, 0 = không hồi phục
  # [EN] Regeneration multiplier (only used when disable-natural-regen: false)
  #     1.0 = vanilla regen, 0.5 = 50% regen, 0 = no regen
  regen-multiplier: 0.5

  # ===== CHIẾN ĐẤU (COMBAT TAG) =====
  # [VI] Thời gian duy trì trạng thái combat (giây).
  #     Combat tag chỉ dùng để cảnh báo trạng thái giao chiến; thoát game không bị ban.
  # [EN] Combat tag duration (seconds).
  #     Combat tag is informational only; quitting while tagged does not cause a ban.
  combat-tag-duration-seconds: 30

  # ===== VẬT PHẨM / ITEMS =====
  # [VI] Sát thương khi sử dụng Ender Pearl (tim)
  # [EN] Damage taken when using Ender Pearl (hearts)
  ender-pearl-damage: 1.0

# ============================================================
# [HUNGER] 🍔 ĐÓI / HUNGER
# ============================================================
hunger:
  # [VI] Bật hệ thống đói
  # [EN] Enable hunger system
  enabled: true

  # [VI] Thời gian giữa các lần giảm đói (giây)
  # [EN] How often hunger decreases (in seconds)
  drain-interval-seconds: 180

  # [VI] Hệ số hồi phục thức ăn (1.0 = bình thường, 0.5 = 50%)
  # [EN] Food restoration multiplier (1.0 = normal, 0.5 = 50%)
  food-restore-multiplier: 0.5

  # [VI] Sát thương khi đói hoàn toàn (tim)
  # [EN] Damage taken when starving (hearts)
  starvation-damage: 1.0

  # [VI] Mức thức ăn tối thiểu để có thể chạy (0-20)
  # [EN] Minimum food level to be able to sprint (0-20)
  sprint-min-food: 6

  # [VI] Bật ngộ độc khi ăn thức ăn sống (thịt sống, thịt thối, cá nóc...)
  # [EN] Enable raw food poisoning (raw meat, rotten flesh, pufferfish...)
  raw-food-poison: true

  # ===== ĂN QUÁ NHANH / CHOKING FROM EATING TOO FAST =====
  # [VI] Nếu bật, người chơi bị nghẹn khi ăn nhiều hơn số món cho phép trong khoảng thời gian.
  # [EN] If enabled, players choke when eating more than the allowed count within the time window.
  choke-enabled: true

  # [VI] Số món tối đa có thể ăn trong cửa sổ thời gian trước khi bị nghẹn.
  # [EN] Maximum number of foods that can be eaten in the time window before choking.
  choke-max-eats: 3

  # [VI] Cửa sổ kiểm tra tốc độ ăn (giây).
  # [EN] Eating-speed check window (seconds).
  choke-window-seconds: 10

  # [VI] Sát thương mỗi lần bị nghẹn (đơn vị HP; 2 HP = 1 tim).
  # [EN] Damage per choking trigger (HP; 2 HP = 1 heart).
  choke-damage: 1.0

  # [VI] Bật hiệu ứng phát nổ khi ăn táo vàng enchanted (Notch Apple)
  # [EN] Enable explosion when eating enchanted golden apple (Notch Apple)
  notch-apple-explode: true

  # [VI] Sát thương từ táo vàng enchanted phát nổ (tim)
  # [EN] Damage from enchanted golden apple explosion (hearts)
  notch-apple-damage: 2.0

# ============================================================
# [THIRST] 💧 KHÁT / THIRST
# ============================================================
thirst:
  # [VI] Bật hệ thống khát nước
  # [EN] Enable thirst system
  enabled: true

  # [VI] Thời gian giữa các lần giảm khát (giây)
  # [EN] How often thirst decreases (in seconds)
  drain-interval-seconds: 120

  # [VI] Sát thương khi khát về 0 (tim)
  # [EN] Damage when thirst reaches 0 (hearts)
  thirst-damage: 2.0

  # [VI] Mức khát tối đa
  # [EN] Maximum thirst level
  max-thirst: 20

  # ===== UỐNG NƯỚC TỪ NGUỒN / DRINK FROM SOURCE =====
  # [VI] Cho phép uống nước trực tiếp từ nguồn nước (sông, hồ, biển, vạc...)
  # [EN] Allow drinking directly from water sources (rivers, lakes, cauldrons...)
  drink-from-source: true

  # [VI] Lượng khát hồi phục khi uống từ nguồn
  # [EN] Thirst restored when drinking from source
  drink-source-restore: 4

  # [VI] Thời gian hồi giữa các lần uống từ nguồn (giây)
  # [EN] Cooldown between drinking from source (seconds)
  drink-source-cooldown-seconds: 3

  # ===== UỐNG NƯỚC TỪ XÔ / DRINK FROM BUCKET =====
  # [VI] Cho phép uống nước từ xô nước (WATER_BUCKET)
  # [EN] Allow drinking from water bucket
  bucket-drink:
    # [VI] Bật uống nước từ xô
    # [EN] Enable drinking from bucket
    enabled: true

    # [VI] Lượng khát hồi phục khi uống từ xô
    # [EN] Thirst restored when drinking from bucket
    restore: 10

  # ===== UỐNG NƯỚC TỪ CHAI / DRINK FROM BOTTLE =====
  # [VI] Cho phép uống nước từ chai thủy tinh (WATER_POTION)
  # [EN] Allow drinking from glass bottle (WATER_POTION)
  bottle-drink:
    # [VI] Bật uống nước từ chai
    # [EN] Enable drinking from bottle
    enabled: true

    # [VI] Lượng khát hồi phục khi uống từ chai
    # [EN] Thirst restored when drinking from bottle
    restore: 6

  # ===== NƯỚC TỰ NHIÊN (SÔNG, BIỂN) / NATURAL WATER (RIVERS, OCEANS) =====
  # [VI] Cấu hình hiệu ứng khi uống nước từ nguồn tự nhiên (sông, suối, biển)
  #     Nước từ vạc (cauldron) không bị ảnh hưởng. Có thể tắt hoàn toàn.
  # [EN] Effects when drinking from natural sources (rivers, streams, oceans).
  #     Water from cauldrons is NOT affected. Can be fully disabled.
  natural-water:
    # [VI] Bật hiệu ứng khi uống nước tự nhiên
    # [EN] Enable effects for drinking natural water
    enabled: true

    # [VI] Sát thương nhận được MỖI GIÂY khi uống nước tự nhiên (tim)
    # [EN] Damage taken PER SECOND when drinking natural water (hearts)
    damage-per-second: 0.5

    # [VI] Tổng thời gian chịu ảnh hưởng của nước bẩn (giây)
    # [EN] Total duration of dirty water effects (seconds)
    duration-seconds: 5

    # [VI] Cường độ hiệu ứng Nausea (buồn nôn / chóng mặt)
    #     0 = Cấp I, 1 = Cấp II, cứ thế tăng dần
    # [EN] Nausea (motion sickness) effect amplifier
    #     0 = Level I, 1 = Level II, and so on
    nausea-amplifier: 0

  # ===== CHAI LỌ / BOTTLES =====
  # [VI] Cho phép lấy nước vào chai thủy tinh từ nguồn nước
  # [EN] Allow filling glass bottles with water from sources
  bottle-fill: true

# ============================================================
# [ENVIRONMENT] 🌍 MÔI TRƯỜNG / ENVIRONMENT
# ============================================================
environment:
  # ===== KIỂM SOÁT MƯA / RAIN CONTROL =====
  rain-control:
    # [VI] Bật giới hạn xác suất bắt đầu mưa và thời lượng mưa.
    # [EN] Enable limits for rain-start chance and rain duration.
    enabled: true

    # [VI] Xác suất chấp nhận mỗi lần thời tiết bắt đầu mưa (phần trăm); mặc định 40, hợp lệ 0-100.
    # [EN] Chance to allow each rain start (percent); default 40, valid range 0-100.
    chance-percent: 40

    # [VI] Thời gian mưa tối đa liên tục (phút); mặc định 5, hợp lệ 1-120.
    # [EN] Maximum continuous rain duration (minutes); default 5, valid range 1-120.
    max-duration-minutes: 5

    # [VI] Chọn ngẫu nhiên thời lượng mưa từ mức tối thiểu đến tối đa để mưa có thể tạnh sớm.
    # [EN] Randomize each rain duration between the minimum and maximum to allow early clearing.
    random-duration:
      # [VI] Bật chọn thời lượng ngẫu nhiên; mặc định true; chỉ true/false.
      # [EN] Enable randomized rain duration; default true; accepts true/false.
      enabled: true

      # [VI] Thời lượng mưa tối thiểu (phút); mặc định 1, hợp lệ từ 1 đến max-duration-minutes.
      # [EN] Minimum rain duration (minutes); default 1, valid from 1 to max-duration-minutes.
      minimum-minutes: 1

  # ===== NHIỆT ĐỘ / TEMPERATURE =====
  temperature:
    # [VI] Bật hệ thống nhiệt độ (nóng ở sa mạc, lạnh ở tuyết)
    # [EN] Enable temperature system (heat in deserts, cold in snow)
    enabled: true

    # [VI] Thời gian giữa các lần kiểm tra nhiệt độ (giây)
    # [EN] How often to check temperature (seconds)
    check-interval-seconds: 30

    # [VI] Sát thương khi ở trong nước lạnh và khoảng cách giữa các lần nhận damage
    # [EN] Damage from cold water and the interval between damage ticks
    water-damage: 1.0
    water-damage-interval-seconds: 10

    # [VI] Sát thương mưa axit khi ở ngoài trời và khoảng cách giữa các lần damage
    # [EN] Acid rain damage while exposed and the interval between damage ticks
    acid-rain-damage: 1.0
    acid-rain-interval-seconds: 5

    # [VI] Sát thương khi ở nơi quá nóng (tim)
    # [EN] Damage when in hot environment (hearts)
    heat-damage: 2.0

    # [VI] Cường độ hiệu ứng nóng (0 = Cấp I, 1 = Cấp II...)
    # [EN] Heat effect amplifier (0 = Level I, 1 = Level II...)
    heat-amplifier: 1

    # [VI] % giảm cường độ hiệu ứng nóng khi đội mũ bảo hiểm (0.5 = 50%)
    #     Bất kỳ loại mũ nào cũng giúp giảm
    # [EN] % heat effect reduction when wearing a helmet (0.5 = 50%)
    #     Any helmet type helps reduce
    helmet-reduce-percent: 0.5

    # [VI] % giảm sát thương nóng khi đội mũ bảo hiểm (0.5 = 50%)
    #     Bất kỳ loại mũ nào cũng giúp giảm sát thương nóng
    # [EN] % heat damage reduction when wearing a helmet (0.5 = 50%)
    #     Any helmet type helps reduce heat damage
    helmet-damage-reduce-percent: 0.5

    # [VI] Thời gian phơi nắng tối thiểu (giây) trước khi bắt đầu hiệu ứng nóng
    #     Giúp người chơi có thời gian tìm bóng râm trước khi bị damage
    # [EN] Minimum exposure time (seconds) before heat effect starts
    #     Gives players time to find shade before taking damage
    heat-exposure-delay-seconds: 30

    # [VI] Sát thương khi ở nơi quá lạnh (tim)
    # [EN] Damage when in cold environment (hearts)
    cold-damage: 2.0

    # [VI] Cường độ hiệu ứng lạnh (0 = Cấp I, 1 = Cấp II...)
    # [EN] Cold effect amplifier (0 = Level I, 1 = Level II...)
    cold-amplifier: 1

    # [VI] % giảm cường độ hiệu ứng lạnh khi mặc giáp (0.25 = 25% mỗi món)
    #     Mỗi món giáp (mũ, áo, quần, giày) giảm độc lập
    # [EN] % cold effect reduction per armor piece (0.25 = 25% per piece)
    #     Each armor piece (helmet, chestplate, leggings, boots) reduces independently
    armor-reduce-percent: 0.20

    # [VI] % giảm sát thương lạnh mỗi món giáp (0.20 = 20% mỗi món)
    #     Mỗi món giáp (mũ, áo, quần, giày) giảm sát thương lạnh độc lập
    # [EN] % cold damage reduction per armor piece (0.20 = 20% per piece)
    #     Each armor piece (helmet, chestplate, leggings, boots) reduces cold damage independently
    armor-damage-reduce-percent: 0.20

    # [VI] Thời gian tiếp xúc lạnh tối thiểu (giây) trước khi bắt đầu hiệu ứng lạnh
    #     Giúp người chơi có thời gian tìm nơi ấm áp trước khi bị damage
    # [EN] Minimum exposure time (seconds) before cold effect starts
    #     Gives players time to find warmth before taking damage
    cold-exposure-delay-seconds: 30

    # [VI] Nhóm biome áp dụng sát thương nóng, lạnh và mưa axit.
    #      Dùng tên biome vanilla hoặc khóa namespace:key; danh sách rỗng bỏ các biome của nhóm đó.
    #      Biome thuộc nhiều nhóm có thể nhận nhiều loại sát thương tương ứng.
    # [EN] Biome groups for heat, cold, and acid-rain damage.
    #      Use vanilla biome names or namespace:key identifiers; an empty list disables that biome group.
    #      A biome in multiple groups can receive each corresponding damage type.
    biomes:
      # [VI] Biome khô hạn gây nóng; Nether luôn nóng bất kể danh sách này.
      # [EN] Arid biomes that cause heat; the Nether is always hot regardless of this list.
      hot:
        - desert
        - badlands
        - wooded_badlands
        - eroded_badlands
        - savanna
        - savanna_plateau
        - windswept_savanna

      # [VI] Biome tuyết/băng và vùng lạnh gây sát thương lạnh và sát thương nước.
      # [EN] Snowy/icy and cold-region biomes that cause cold and water damage.
      cold:
        - snowy_plains
        - snowy_taiga
        - snowy_slopes
        - snowy_beach
        - frozen_ocean
        - frozen_river
        - ice_spikes
        - frozen_peaks
        - jagged_peaks
        - grove
        - taiga
        - old_growth_taiga
        - old_growth_pine_taiga
        - old_growth_spruce_taiga
        - cold_ocean
        - deep_cold_ocean

      # [VI] Biome rừng chịu mưa axit khi trời mưa và người chơi ở ngoài trời.
      # [EN] Forest biomes affected by acid rain while it is raining and the player is uncovered.
      acid-rain:
        - forest
        - flower_forest
        - birch_forest
        - old_growth_birch_forest
        - dark_forest
        - jungle
        - sparse_jungle
        - bamboo_jungle
        - taiga
        - old_growth_pine_taiga
        - old_growth_spruce_taiga

  # ===== SƯƠNG MÙ / FOG (DARKNESS EFFECT) =====
  fog:
    # [VI] Bật hiệu ứng sương mù (Darkness effect)
    #     Làm tối tầm nhìn của người chơi định kỳ
    # [EN] Enable fog effect (Darkness effect)
    #     Periodically darkens the player's vision
    enabled: false

    # [VI] Thời gian giữa các đợt áp dụng sương mù (giây)
    #     Giá trị càng cao thì sương mù càng hiếm xuất hiện
    # [EN] Interval between fog applications (seconds)
    #     Higher values mean fog occurs less frequently
    interval-seconds: 60

    # [VI] Thời gian hiệu ứng sương mù kéo dài (giây)
    #     Giá trị càng cao thì càng mù lâu hơn
    # [EN] Duration of fog (Darkness) effect (seconds)
    #     Higher values means longer blindness
    effect-duration-seconds: 30

    # [VI] Cường độ hiệu ứng mù (0 = Cấp I nhẹ, 1 = Cấp II nặng hơn)
    #     Giá trị càng cao thì mù càng nặng
    # [EN] Fog effect amplifier (0 = Level I mild, 1 = Level II stronger)
    #     Higher values = stronger blindness
    effect-amplifier: 0

  # ===== NGỦ / SLEEP =====
  sleep:
    # [VI] Chặn ngủ (không cho phép lên giường)
    # [EN] Block sleeping (prevents using beds)
    block: true

    # [VI] Sát thương khi cố gắng ngủ (tim)
    # [EN] Damage taken when attempting to sleep (hearts)
    damage: 2.0

  # ===== CÂY TRỒNG / CROP GROWTH =====
  crop-slow:
    # [VI] Bật làm chậm sự phát triển của cây trồng
    # [EN] Enable slower crop growth
    enabled: true

    # [VI] Hệ số tốc độ phát triển (1.0 = bình thường, 0.5 = chậm 50%)
    # [EN] Growth speed multiplier (1.0 = normal, 0.5 = 50% slower)
    multiplier: 0.75

  # ===== ĐỘ BỀN CÔNG CỤ / TOOL DURABILITY =====
  tool-wear:
    # [VI] Bật hao mòn công cụ nhanh hơn
    # [EN] Enable faster tool wear
    enabled: true

    # [VI] Hệ số hao mòn thêm (1.0 = bình thường, 1.5 = hao nhanh gấp 1.5)
    # [EN] Extra durability loss multiplier (1.0 = normal, 1.5 = 1.5x faster)
    multiplier: 1.5

  # ===== BAY / FLIGHT =====
  flight:
    # [VI] Chặn bay (kể cả Creative mode, trừ khi có permission vnmine.hardcore.bypass)
    # [EN] Block flight (even in Creative mode, unless has vnmine.hardcore.bypass permission)
    block: false

  # ===== SỢ HẦM / CLAUSTROPHOBIA =====
  claustrophobia:
    # [VI] Bật hiệu ứng sợ hầm (dưới lòng đất)
    # [EN] Enable claustrophobia effect (underground)
    enabled: true

    # [VI] Cao độ Y tối đa để kích hoạt sợ hầm
    # [EN] Maximum Y level for claustrophobia to trigger
    y-level: 30

    # [VI] Tỷ lệ kích hoạt mỗi bước di chuyển (phần trăm)
    # [EN] Trigger chance per movement (percent)
    chance: 5

    # [VI] Cường độ hiệu ứng sợ hầm (0 = Cấp I, 1 = Cấp II...)
    # [EN] Claustrophobia effect amplifier (0 = Level I, 1 = Level II...)
    amplifier: 0

    # [VI] % giảm cường độ hiệu ứng khi cầm đuốc (0.5 = 50%)
    #     Cầm đuốc ở tay chính hoặc tay phụ đều có tác dụng
    # [EN] % effect reduction when holding a torch (0.5 = 50%)
    #     Holding torch in main hand or offhand works
    torch-reduce-percent: 1.0

  # ===== CHÓNG MẶT / VERTIGO =====
  vertigo:
    # [VI] Bật hiệu ứng chóng mặt (trên cao)
    # [EN] Enable vertigo effect (high altitude)
    enabled: true

    # [VI] Cao độ Y tối thiểu để kích hoạt chóng mặt
    # [EN] Minimum Y level for vertigo to trigger
    y-level: 170

    # [VI] Tỷ lệ kích hoạt mỗi bước di chuyển (phần trăm)
    # [EN] Trigger chance per movement (percent)
    chance: 10

    # [VI] Cường độ hiệu ứng chóng mặt (0 = Cấp I, 1 = Cấp II...)
    # [EN] Vertigo effect amplifier (0 = Level I, 1 = Level II...)
    amplifier: 1

    # [VI] % giảm cường độ hiệu ứng khi đeo cánh (0.5 = 50%)
    # [EN] % effect reduction when wearing elytra (0.5 = 50%)
    elytra-reduce-percent: 0.5

# ============================================================
# [VILLAGER TRADING] 🏘️ GIAO DỊCH DÂN LÀNG
# ============================================================
# [VI] Quản lý giao dịch của dân làng theo biome.
#      Khi đặt workstation, dân làng sẽ học nghề phù hợp với biome.
#      Nếu disable-random-villager: true, dân làng thất nghiệp không thể random nghề.
# [EN] Manages villager trading by biome.
#      When placing a workstation, villagers learn professions suitable for their biome.
#      If disable-random-villager: true, unemployed villagers cannot randomly acquire professions.
villager-trading:
  # [VI] Bật hệ thống giao dịch dân làng theo biome
  # [EN] Enable villager trading system by biome
  enabled: true

  # [VI] Không cho phép dân làng thất nghiệp học nghề random khi đặt workstation
  # [EN] Prevent unemployed villagers from randomly acquiring professions when placing workstations
  disable-random-villager: true

  # [VI] Kích thước vùng (region) để đánh dấu biome instance (khối)
  #     Mỗi vùng 500x500 blocks có data trade riêng, không phụ thuộc vùng khác
  #     Cùng biome nhưng khác vùng → data trade khác nhau
  # [EN] Region size to mark biome instances (blocks)
  #     Each 500x500 region has its own trade data, independent from other regions
  #     Same biome but different region → different trade data
  region-size: 500

# ============================================================
# [SPAWNER CONTROL] 🪤 KIỂM SOÁT LỒNG FARM
# ============================================================
# [VI] Kiểm soát quái vật sinh ra từ lồng farm (spawner).
#      Giảm số lượng, tăng HP và damage để cân bằng gameplay.
# [EN] Controls mobs spawned from spawners.
#      Reduces spawn rate, increases HP and damage to balance gameplay.
spawner-control:
  # [VI] Bật hệ thống kiểm soát lồng farm
  # [EN] Enable spawner control system
  enabled: true

  # [VI] Tỷ lệ spawn quái vật từ lồng (0.3 = 30% tỷ lệ gốc, giảm 70%)
  #     1.0 = spawn bình thường, 0.0 = không spawn gì cả
  # [EN] Mob spawn rate from spawners (0.3 = 30% of original rate, 70% reduction)
  #     1.0 = normal spawn, 0.0 = no spawns at all
  spawn-rate-reduction: 0.3

  # [VI] Hệ số nhân HP của quái vật từ lồng (3.0 = HP x3)
  # [EN] HP multiplier for spawner mobs (3.0 = 3x HP)
  hp-multiplier: 3.0

  # [VI] Hệ số nhân sát thương của quái vật từ lồng (2.0 = damage x2)
  #      Áp dụng dưới dạng hiệu ứng STRENGTH
  # [EN] Damage multiplier for spawner mobs (2.0 = 2x damage)
  #      Applied as STRENGTH effect
  damage-multiplier: 2.0

# ============================================================
# [TIME CONTROL] ☀️🌙 ĐIỀU KHIỂN NGÀY VÀ ĐÊM
# ============================================================
# [VI] Thời lượng ban ngày và ban đêm tính theo phút thực tế.
#      10 phút cho mỗi pha là tốc độ mặc định của Minecraft.
# [EN] Day and night duration in real-world minutes.
#      10 minutes per phase matches Minecraft's default cycle.
time-control:
  enabled: true
  # [VI] Áp dụng cho mọi world trừ Nether; world không khai báo riêng kế thừa global.
  # [EN] Applies globally except Nether; worlds without overrides inherit these values.
  global:
    day-duration-minutes: 10
    night-duration-minutes: 10

  # [VI] Ghi đè tùy chọn theo tên world; trường nào bỏ trống sẽ kế thừa global.
  # [EN] Optional per-world overrides; omitted values inherit from global.
  worlds: {}
  # Ví dụ:
  # worlds:
  #   world_resource:
  #     day-duration-minutes: 6
  #     night-duration-minutes: 14
  #   world_the_end:
  #     day-duration-minutes: 20

# ============================================================
# [ORE CONTROL] ⛏️ KIỂM SOÁT QUẶNG
# ============================================================
# [VI] Kiểm soát tỷ lệ sinh ra quặng khi tạo world mới.
#      Chỉ áp dụng khi world chưa tồn tại và được tạo mới.
#      Tỷ lệ được tính trên 100 block quặng trong chunk.
# [EN] Controls ore spawn rate when generating new worlds.
#      Only applies when world doesn't exist and is being newly created.
#      Rate is calculated per 100 ore blocks in a chunk.
ore-control:
  # [VI] Bật hệ thống kiểm soát quặng
  # [EN] Enable ore control system
  enabled: false

  # ===== CẤU HÌNH THEO WORLD =====
  # [VI] Mỗi world có thể cấu hình tỷ lệ quặng riêng
  # [EN] Each world can have its own ore rate configuration
  worlds:
    # [VI] Tên world (ví dụ: world, world_nether, world_the_end)
    # [EN] World name (e.g. world, world_nether, world_the_end)
    world:
      # [VI] Tỷ lệ quặng kim cương (0.18 = 0.18% so với tỷ lệ vanilla)
      # [EN] Diamond ore rate (0.18 = 0.18% of vanilla rate)
      DIAMOND_ORE: 0.08

      # [VI] Tỷ lệ quặng emerald (0.05 = 0.05%)
      # [EN] Emerald ore rate (0.05 = 0.05%)
      EMERALD_ORE: 0.05

      # [VI] Tỷ lệ quặng sắt (1.20 = 1.2%)
      # [EN] Iron ore rate (1.20 = 1.2%)
      IRON_ORE: 0.60

      # [VI] Tỷ lệ quặng vàng (0.45 = 0.45%)
      # [EN] Gold ore rate (0.45 = 0.45%)
      GOLD_ORE: 0.45

      # [VI] Tỷ lệ quặng than (2.50 = 2.5%)
      # [EN] Coal ore rate (2.50 = 2.5%)
      COAL_ORE: 1.50

      # [VI] Tỷ lệ quặng lapis (0.30 = 0.3%)
      # [EN] Lapis ore rate (0.30 = 0.3%)
      LAPIS_ORE: 0.30

      # [VI] Tỷ lệ quặng redstone (1.00 = 1.0%)
      # [EN] Redstone ore rate (1.00 = 1.0%)
      REDSTONE_ORE: 0.5

      # [VI] Tỷ lệ quặng đồng (1.50 = 1.5%)
      # [EN] Copper ore rate (1.50 = 1.5%)
      COPPER_ORE: 0.70

      # ===== DEEPSLATE ORES =====
      DEEPSLATE_DIAMOND_ORE: 0.18
      DEEPSLATE_EMERALD_ORE: 0.05
      DEEPSLATE_IRON_ORE: 1.20
      DEEPSLATE_GOLD_ORE: 0.45
      DEEPSLATE_COAL_ORE: 2.50
      DEEPSLATE_LAPIS_ORE: 0.30
      DEEPSLATE_REDSTONE_ORE: 1.00
      DEEPSLATE_COPPER_ORE: 1.50

      # ===== NETHER ORES =====
      NETHER_QUARTZ_ORE: 2.00
      NETHER_GOLD_ORE: 0.80
      ANCIENT_DEBRIS: 0.002

# ============================================================
# [BLOCK DROP, TOOL BREAK & EXPLOSION] ⛏️💥
# ============================================================
# [VI] Tỷ lệ thay đổi vật phẩm rơi, gãy cúp và nổ khi đào block.
#      Mỗi chance nằm trong khoảng 0-100; các hiệu ứng được thử độc lập.
#      damage-player: false chỉ ngăn sát thương vụ nổ này lên người chơi.
# [EN] Configure replacement drops, tool breakage, and mining explosions.
#      Each chance is 0-100; effects are rolled independently.
block-drop-settings:
  enabled: true
  replace-enabled: true
  break-enabled: true
  explode-enabled: true
  rules:
    - block: diamond_ore
      iron_pickaxe:
        drop-replace: { enabled: true, replace-block: coal, chance: 30 }
        tool-break: { enabled: true, chance: 5, message: "&cCúp sắt của bạn đã bị gãy!" }
        explode: { enabled: true, power: 3.0, break-blocks: true, set-fire: false, damage-player: true, chance: 10, message: "&cKhối kim cương phát nổ!" }
      diamond_pickaxe:
        drop-replace: { enabled: true, replace-block: coal, chance: 10 }
        tool-break: { enabled: true, chance: 1, message: "&cCúp kim cương của bạn bị nứt!" }
        explode: { enabled: true, power: 3.0, break-blocks: true, set-fire: false, damage-player: true, chance: 5, message: "&cKhối kim cương phát nổ!" }
    - block: deepslate_diamond_ore
      iron_pickaxe:
        drop-replace: { enabled: true, replace-block: cobblestone, chance: 50 }
        tool-break: { enabled: true, chance: 8, message: "&cCúp sắt của bạn vỡ tan!" }
        explode: { enabled: true, power: 3.5, break-blocks: true, set-fire: false, damage-player: true, chance: 15, message: "&cDeepslate kim cương phát nổ!" }
      diamond_pickaxe:
        drop-replace: { enabled: true, replace-block: coal, chance: 15 }
        tool-break: { enabled: true, chance: 2, message: "&cCúp kim cương của bạn bị hư hại!" }
        explode: { enabled: true, power: 3.5, break-blocks: true, set-fire: false, damage-player: true, chance: 8, message: "&cDeepslate kim cương phát nổ!" }
    - block: ancient_debris
      diamond_pickaxe:
        drop-replace: { enabled: true, replace-block: netherrack, chance: 25 }
        tool-break: { enabled: true, chance: 3, message: "&cCúp kim cương của bạn nứt vỡ!" }
        explode: { enabled: true, power: 5.0, break-blocks: true, set-fire: true, damage-player: true, chance: 20, message: "&4Ancient Debris phát nổ!" }
    - block: gold_ore
      stone_pickaxe:
        explode: { enabled: true, power: 2.0, break-blocks: true, set-fire: false, damage-player: true, chance: 5, message: "&eVàng phát nổ!" }
      iron_pickaxe:
        explode: { enabled: true, power: 2.0, break-blocks: true, set-fire: false, damage-player: true, chance: 3, message: "&eVàng phát nổ!" }
    - block: emerald_ore
      iron_pickaxe:
        drop-replace: { enabled: true, replace-block: emerald, chance: 20 }
        explode: { enabled: true, power: 2.5, break-blocks: true, set-fire: false, damage-player: true, chance: 8, message: "&aKhối ngọc lục bảo phát nổ!" }
    - block: nether_gold_ore
      stone_pickaxe:
        drop-replace: { enabled: true, replace-block: netherrack, chance: 40 }
        explode: { enabled: true, power: 2.0, break-blocks: true, set-fire: true, damage-player: true, chance: 12, message: "&6Vàng nether phát nổ!" }

# ============================================================
# [RENAME] 🏷 ĐỔI TÊN HIỂN THỊ SAU KHI CHẾT
# ============================================================
# [VI] Tự động đổi tên hiển thị của người chơi sau khi chết.
#      Tên hiển thị thay đổi trong CHAT và TAB LIST, không ảnh hưởng đến tên thật.
# [EN] Auto-rename player display name after death.
#      Changes name in CHAT and TAB LIST only, does NOT affect the real player name.
rename:
  # [VI] Bật tính năng đổi tên
  # [EN] Enable rename feature
  enabled: true

  # [VI] Định dạng tên hiển thị sau khi chết.
  #     Các placeholder (ký hiệu đặc biệt) có sẵn:
  #       <name>   - Tên gốc của người chơi (ví dụ: hoanbh)
  #       <count>  - Số lần chết (số thường, không có số 0 ở đầu, ví dụ: 1, 15, 200)
  #       000      - Dãy số 0: đại diện cho số lần chết có padding (thêm số 0 ở đầu).
  #                  Số lượng chữ số 0 = độ dài tối thiểu của số.
  #                  Ví dụ với số lần chết = 3:
  #                    000 -> 003
  #                    0000 -> 0003
  #                  Ví dụ với số lần chết = 15:
  #                    000 -> 015
  #                    0000 -> 0015
  #
  #     Bạn có thể kết hợp các placeholder và text tùy ý.
  #
  #     Ví dụ các định dạng mẫu:
  #       "<name> đã chết 000 lần"
  #         → hoanbh đã chết 001 lần
  #         → hoanbh đã chết 015 lần
  #
  #       "<name>_000"
  #         → hoanbh_001
  #         → hoanbh_015
  #
  #       "000 | <name>"
  #         → 001 | hoanbh
  #
  #       "<name> (<count>)"
  #         → hoanbh (1)
  #         → hoanbh (15)
  #
  #       "0000"
  #         → 0001 (chỉ hiện số)
  #
  # [EN] Display name format after death.
  #     Available placeholders:
  #       <name>   - Player's original name (e.g. hoanbh)
  #       <count>  - Death count (plain number, e.g. 1, 15, 200)
  #       000      - Zero-padded death counter. Number of zeros = minimum digits.
  #                  e.g. deathCount=3: 000 -> 003, 0000 -> 0003
  #
  #     Examples:
  #       "<name> died 000 times"  → "hoanbh died 001 times"
  #       "<name>_000"           → "hoanbh_001"
  #       "000 | <name>"          → "001 | hoanbh"
  #       "<name> (<count>)" → "hoanbh (1)"
  #       "0000"                     → "0001"
  name-structure: "<name> ☠ <count>"

# ============================================================
# [ECONOMY] 🌻 TIỀN TỆ / CURRENCY
# ============================================================
# [VI] Ví VNCOIN và phần thưởng từ quái cơ bản.
# [EN] VNCOIN wallet and basic-mob rewards.
economy:
  enabled: true
  inflation:
    # [VI] Cửa sổ thời gian dùng bởi /vncoin stats; hợp lệ từ 1 đến 365 ngày.
    # [EN] Time window used by /vncoin stats; valid range is 1 to 365 days.
    window-days: 30
  mob-drops:
    enabled: true
    # [VI] Tỉ lệ thử một lần cho mỗi quái cơ bản hợp lệ bị hạ bởi người chơi.
    # [EN] Chance rolled once for each eligible basic mob killed by a player.
    chance: 0.20
    # [VI] Xác suất này được áp dụng sau khi đã trúng tỉ lệ rơi chung; 5% tương đương khoảng 1% số quái bị hạ.
    # [EN] Rolled after the general drop succeeds; 5% means about 1% of kills become critical drops.
    critical-drop-chance: 0.05
    critical-min: 5
    critical-max: 7
    # [VI] Log từng lần roll/drop/spawn bị loại. Chỉ bật trong thời gian kiểm thử vì rất nhiều dòng.
    # [EN] Log each roll/drop/eligibility decision. Enable only while testing; this can be verbose.
    debug-logs: false
    # [VI] Mặc định không tính quái từ spawner, triệu hồi plugin, tuần tra hoặc sự kiện.
    # [EN] Spawner, plugin summons, patrols and event mobs are excluded by default.
    eligible-spawn-reasons:
      - NATURAL
      - CHUNK_GEN
    tiers:
      # [VI] Lượng thường giữ ở mức 1-2 coin cho mọi tier; critical drop dùng khoảng riêng phía trên.
      # [EN] Regular drops stay at 1-2 coins for every tier; critical drops use the separate range above.
      I:
        min: 1
        max: 2
        entities: [ZOMBIE, SKELETON, SPIDER, SILVERFISH]
      II:
        min: 1
        max: 2
        entities: [HUSK, STRAY, DROWNED, CAVE_SPIDER]
      III:
        min: 1
        max: 2
        entities: [WITCH, ENDERMAN, PILLAGER, MAGMA_CUBE]
      IV:
        min: 1
        max: 2
        entities: [RAVAGER, EVOKER, GUARDIAN]
  boss-drops:
    enabled: true
    # [VI] Tổng VNCOIN cho boss hạ bởi nhóm người chơi đủ điều kiện nhận thưởng.
    # [EN] Total VNCOIN for a boss defeated by eligible player contributors.
    total-coins: 100
    # [VI] Chia thành các vật phẩm riêng; 100 coin / 5 coin = 20 drop.
    # [EN] Split into separate items; 100 coins / 5 coins = 20 drops.
    coins-per-drop: 5
    scatter-radius: 5.0
  merchant:
    # [VI] Bật/tắt cửa hàng VNCOIN mở từ NPC; mặc định bật.
    # [EN] Enable the VNCOIN shop opened by an NPC; defaults to true.
    enabled: true
    # [VI] Giá bán item vanilla nằm trong merchant-prices.yml; không dùng giá fallback chung.
    # [EN] Vanilla item sell prices are configured in merchant-prices.yml; there is no universal fallback.
    # [VI] Danh mục chung bán bởi NPC system-merchant. Mỗi giá từ 1 đến 1,000,000; số lượng không vượt kích thước stack.
    # [EN] Shared catalog sold by system-merchant NPCs. Each price is 1-1,000,000; amount cannot exceed the stack size.
    offers:
      bread:
        # [VI] Vật phẩm Minecraft cần giao; phải là Material dạng item hợp lệ.
        # [EN] Minecraft item to deliver; must be a valid item Material.
        material: BREAD
        # [VI] Số vật phẩm giao cho mỗi lần mua; mặc định 4.
        # [EN] Number of items delivered per purchase; defaults to 4.
        amount: 4
        # [VI] Giá tính bằng VNCOIN; giá phải lớn hơn 0 và tối đa 1,000,000.
        # [EN] Price in VNCOIN; must be greater than 0 and at most 1,000,000.
        price: 2
        # [VI] Tên hiển thị trong cửa hàng; từ 1 đến 48 ký tự.
        # [EN] Name shown in the shop; 1-48 characters.
        name: "Bánh mì"
    custom:
      # [VI] Bật/tắt cửa hàng gắn riêng trên từng NPC merchant tùy chỉnh; mặc định bật.
      # [EN] Enable item shops stored on each custom merchant NPC; defaults to true.
      enabled: true
      # [VI] Số mặt hàng tối đa trên mỗi shop; mặc định 45, hợp lệ 1-45.
      # [EN] Maximum offers per custom shop; defaults to 45, valid range 1-45.
      max-offers: 45
      # [VI] Giá cao nhất cho mỗi món; mặc định 1,000,000 VNCOIN, hợp lệ 1-2,147,483,647.
      # [EN] Maximum price per offer; defaults to 1,000,000 VNCOIN, valid range 1-2,147,483,647.
      max-price: 1000000
      # [VI] Ba mức nút giảm/tăng giá theo thứ tự nhỏ/vừa/lớn; mặc định 1, 10, 100; mỗi mức 1-1,000,000.
      # [EN] Three decrement/increment button steps in small/medium/large order; defaults to 1, 10, 100; each 1-1,000,000.
      price-steps: [1, 10, 100]

# ============================================================
# [LOGGING] 📝 NHẬT KÝ / LOGGING
# ============================================================
# [VI] Cấu hình ghi nhật ký hệ thống
# [EN] System logging configuration
logging:
  # [VI] Bật log debug trong console (dành cho debug, có thể rất nhiều dòng)
  # [EN] Enable debug console logs (for debugging, may be very verbose)
  console-debug: true

  # [VI] Ghi nhật ký các cái chết
  # [EN] Log deaths
  log-deaths: true

  # [VI] Ghi nhật ký các sự kiện thiên tai
  # [EN] Log disasters
  log-disasters: true

# ============================================================
# [GRAVES] ⚰️ NGÔI MỘ / GRAVES
# ============================================================
# [VI] Khi người chơi chết, một ngôi mộ sẽ được xây tại vị trí chết.
#      Ngôi mộ chứa toàn bộ items của người chơi.
#      Người chơi có thể click vào đầu (head) trên bia mộ để lấy lại items.
#
#      Thời gian bảo vệ:
#      1. Protection (mặc định 30 phút): Chỉ chủ mộ mới lấy được items
#      2. Public (mặc định 15 phút): Mọi người đều có thể lấy items
#      3. Hết hạn: Mộ thành trống, chỉ hiển thị tin nhắn
#
#      Nếu người chơi chết thêm x lần (expire-deaths) thì mộ cũ sẽ tự động
#      thành trống dù chưa hết thời gian.
# [EN] When a player dies, a grave is built at their death location.
#      The grave contains all of the player's items.
#      Players can click the head on the gravestone to retrieve items.
#
#      Time phases:
#      1. Protection (default 30 min): Only the owner can retrieve
#      2. Public (default 15 min): Everyone can retrieve
#      3. Expired: Grave becomes empty, shows message only
#
#      If the player dies x more times (expire-deaths), old graves become
#      empty even if the time hasn't expired.
graves:
  # [VI] Bật hệ thống ngôi mộ
  # [EN] Enable grave system
  enabled: true

  # [VI] Thời gian chỉ chủ mộ được lấy items (phút)
  #     Trong thời gian này, chỉ người chết mới có thể click vào mộ
  #     để lấy lại đồ. Thời gian hiển thị màu XANH LÁ.
  # [EN] Time only the grave owner can retrieve items (minutes)
  #     During this time, only the deceased can click the grave
  #     to retrieve items. Time displayed in GREEN.
  protection-minutes: 30

  # [VI] Thời gian mọi người có thể lấy items (phút)
  #     Sau thời gian protection, bất kỳ ai cũng có thể lấy items từ mộ.
  #     Thời gian hiển thị màu XANH DA TRỜI.
  # [EN] Time everyone can retrieve items (minutes)
  #     After protection time, anyone can retrieve items from the grave.
  #     Time displayed in BLUE.
  public-minutes: 15

  water-surface-placement:
    # [VI] Bật đặt mộ trên mặt nước khi người chơi chết dưới nước; mặc định true.
    # [EN] Place graves above the water surface when a player dies underwater; default true.
    enabled: true
    # [VI] Vật liệu block hỗ trợ tạm; phải là vật liệu block đặc, mặc định COBBLESTONE.
    # [EN] Temporary support block material; must be solid, default COBBLESTONE.
    support-material: COBBLESTONE

  # [VI] Sau bao nhiêu lần chết thì mộ cũ thành trống
  #     Ví dụ: expire-deaths: 3
  #     Nếu người chơi chết lần 1 (tạo mộ A), chết lần 4 (cách 3 lần chết)
  #     thì mộ A sẽ tự động thành trống.
  #     0 = vô hiệu hóa (chỉ dựa vào thời gian)
  # [EN] After how many deaths the old grave becomes empty
  #     Example: expire-deaths: 3
  #     If player dies 1st time (creates grave A), dies 4th time (3 deaths later)
  #     then grave A becomes empty.
  #     0 = disabled (time-based only)
  expire-deaths: 3

  # [VI] Tin nhắn khi mộ đã trống (không còn items)
  # [EN] Message when grave is empty (no items left)
  empty-message: "§7Ngôi mộ này chỉ còn xương trắng..."

  # [VI] Định dạng hiển thị tên trên bia mộ
  #     {name} - Tên người chơi (tự động thêm màu đỏ)
  #     {time} - Thời gian còn lại (MM:SS, tự động đổi màu)
  #     Màu sắc thời gian tự động:
  #       - §a§l (xanh lá đậm): đang trong protection
  #       - §b§l (xanh da trời đậm): đang trong public
  # [EN] Grave display name format
  #     {name} - Player name (auto-colored red)
  #     {time} - Remaining time (MM:SS, auto-colored)
  #     Time colors:
  #       - §a§l (bold green): in protection phase
  #       - §b§l (bold blue): in public phase
  display-format: "§cR.I.P §4{name} §c- {time}"
