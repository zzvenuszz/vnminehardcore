    # [EN] Book display name; required and must not be blank.
    display-name: "Truyền Thừa Kiếm Khí"
    # [VI] Độ hiếm; nhận common, uncommon, rare, epic hoặc legendary.
    # [EN] Rarity; accepts common, uncommon, rare, epic, or legendary.
