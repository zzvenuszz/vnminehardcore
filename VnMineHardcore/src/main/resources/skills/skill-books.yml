    # [VI] Material vật phẩm; phải là item Material hợp lệ và không phải AIR.
    # [EN] Item Material; must be a valid item Material and not AIR.
    material: ENCHANTED_BOOK
    # [VI] Lore của sách; từ 1 đến 20 dòng không rỗng.
    # [EN] Book lore; 1 to 20 non-empty lines.
    # [VI] Giá bán một cuốn qua system merchant; mặc định 0 nghĩa là không thu mua, hợp lệ 0-1000000 VNCOIN.
    # [EN] System-merchant sell value per book; default 0 means not purchasable, valid range 0-1000000 VNCOIN.
    sell-value: 0
