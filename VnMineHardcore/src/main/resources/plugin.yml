name: VnMineHardcore
version: ${project.version}
main: com.vnmine.hardcore.VnMineHardcore
depend: [ProtocolLib]
api-version: '26.3'
author: VnMineTeam
description: Hardcore survival plugin with thirst, disasters, combat tag, and configurable gameplay

commands:
  vnstats:
    description: Xem thống kê cá nhân (số lần chết, thời gian sống, quái giết)
    usage: /vnstats
    permission: vnmine.command.stats
  vnhardcore:
    description: Xem trạng thái plugin
    usage: /vnhardcore
    permission: vnmine.command.status
  vnreload:
    description: Tải lại file cấu hình config.yml
    usage: /vnreload
    permission: vnmine.command.reload
  debug:
    description: Bật/tắt logging.console-debug trong config.yml
    usage: /debug ON|OFF
    permission: vnmine.command.debug
  vnrespawn:
    description: Hồi sinh sau khi chết
    usage: /vnrespawn
    permission: vnmine.command.respawn
  vnleave:
    description: Thoát game sau khi chết
    usage: /vnleave
    permission: vnmine.command.leave
  fly:
    description: Bật hoặc tắt bay trong chế độ Sinh tồn (admin)
    usage: /fly
    permission: vnmine.command.fly
  nodame:
    description: Bật hoặc tắt miễn sát thương để thử boss (admin)
    usage: /nodame
    permission: vnmine.command.nodame
  spawn:
    description: Dịch chuyển về điểm spawn của thế giới (admin)
    usage: /spawn
    permission: vnmine.command.spawn
  gm0:
    description: Chuyển sang chế độ Sinh tồn (admin)
    usage: /gm0
    permission: vnmine.command.gamemode
  gm1:
    description: Chuyển sang chế độ Sáng tạo (admin)
    usage: /gm1
    permission: vnmine.command.gamemode
  gm2:
    description: Chuyển sang chế độ Phiêu lưu (admin)
    usage: /gm2
    permission: vnmine.command.gamemode
  gm3:
    description: Chuyển sang chế độ Quan sát (admin)
    usage: /gm3
    permission: vnmine.command.gamemode
  vnhelp:
    description: Hiển thị hướng dẫn các lệnh bạn có quyền sử dụng
    usage: /vnhelp
    permission: vnmine.command.help
  vnevent:
    description: Gọi hoặc dừng thiên tai. Gõ /vnevent để xem danh sách sự kiện.
    usage: /vnevent [<id> <warning(s)> <duration(s)>|stop]
    permission: vnmine.command.disasters
  vnboss:
    description: Gọi boss theo level hoặc kết thúc boss đang xuất hiện (không điểm/loot).
    usage: /vnboss <id> <level> <warning(s)> <duration(s)> | /vnboss kill
    permission: vnmine.command.bosses
  vn:
    description: Lệnh tiện ích. Dùng /vn death reset <player> để reset số lần chết.
    usage: /vn <subcommand>
    permission: vnmine.command.utility
  reward:
    description: Nhận phần thưởng xếp hạng boss đang chờ
    usage: /reward
    permission: vnmine.command.reward
  scoreboard:
    description: Quản lý scoreboard xếp hạng boss
    aliases: [vnscoreboard, sb]
    usage: /scoreboard reset
    permission: vnmine.command.scoreboard.reset
  vntime:
    description: Đặt thời lượng chu kỳ ban ngày và ban đêm
    usage: /vntime set <day|night> <phút> [world]
    permission: vnmine.command.time.manage
  vnday:
    description: Đặt world hiện tại về một ngày trong game
    usage: /vnday set <ngày>
    permission: vnmine.command.day.manage
  vnspawn:
    description: Quản lý điểm spawn và các khu vực được bảo vệ
    usage: /vnspawn <set|go <world>|protect <X>|list|remove <ID>>
    permission: vnmine.command.spawn.manage
  tp:
    description: Dịch chuyển người chơi đến điểm spawn của world
    usage: /tp <user> <world>
    permission: vnmine.command.teleport.other
  vngroup:
    description: Quản lý các nhóm quyền của người chơi
    usage: /vngroup <list|info|create|delete|permission>
    permission: vnmine.command.groups.manage
  vnuser:
    description: Quản lý nhóm và quyền riêng của người chơi
    usage: /vnuser <info|group|permission|reset>
    permission: vnmine.command.users.manage
  vnarmy:
    description: Thuê và quản lý lính đánh thuê của người chơi
    usage: /vnarmy <gui|list|hire|recall [ID]|rest [ID]|rename|attack|defend|protect|gear|item|mute|remove|clear|give|token>
    permission: vnmine.command.army
  vndeathhistory:
    description: Xem và khôi phục lịch sử inventory lúc người chơi chết (admin)
    usage: /vndeathhistory [player]
    permission: vnmine.command.death.history
  vnskills:
    description: Mở quick cast, cây kỹ năng hoặc xem kỹ năng RPG đã học
    usage: /vnskills [list|tree]
    permission: vnmine.command.skills
  vnskillbook:
    description: Cấp sách kỹ năng cho người chơi (admin)
    usage: /vnskillbook <give <người_chơi> <book-id>|config>
    permission: vnmine.command.skillbook.admin
  vnportal:
    description: Tạo và quản lý các portal dịch chuyển RPG
    usage: /vnportal <wand|pos1|pos2|create|setspawn|link|unlink|enable|disable|remove|info|list|validate>
    permission: vnmine.command.portal.admin
  vnnpc:
    description: Tạo và quản lý các NPC RPG
    usage: /vnnpc <create|edit|rename|move|remove|info|list>
    permission: vnmine.command.npc.admin
  vntext:
    description: Tạo, chỉnh sửa và quản lý text display cố định trong thế giới
    usage: /vntext <create|edit|move|remove|info|list>
    permission: vnmine.command.text.manage
  vnquest:
    description: Mở nhật ký quest hoặc giao diện quản trị quest RPG
    usage: /vnquest <journal|detail <id>|admin>
    permission: vnmine.command.quest
  alias:
    description: Đặt hoặc xóa tên hiển thị alias của người chơi
    usage: /alias [set <tên>|clear] hoặc /alias set|clear <người_chơi> [tên]
  realname:
    description: Tra tên thật của người chơi bằng username hoặc alias
    usage: /realname <username|alias>
  vnmenu:
    description: Mở menu chức năng của VnMineHardcore
    usage: /vnmenu
    permission: vnmine.command.menu
  vncoin:
    description: Xem ví, lịch sử hoặc quản trị tiền tệ VNCOIN
    usage: /vncoin [balance|history [người_chơi]|stats|give|take <người_chơi> <số> [lý_do]]
    permission: vnmine.command.coin
  pay:
    description: Chuyển VNCOIN cho người chơi khác
    usage: /pay <tên người chơi> <số tiền>
    permission: vnmine.command.pay
  vnplayeradmin:
    description: Mở giao diện quản trị người chơi online và offline
    usage: /vnplayeradmin
    permission: vnmine.command.playeradmin
  feed:
    description: Hồi đầy thanh thức ăn
    usage: /feed
    permission: vnmine.command.feed
  heal:
    description: Hồi đầy máu
    usage: /heal
    permission: vnmine.command.heal

  vninit:
    description: Mở trình hướng dẫn setup RPG lần đầu cho server
    usage: /vninit
    permission: vnmine.command.init
  vnregion:
    description: Quản lý vùng WorldEdit/WorldGuard bằng GUI
    usage: /vnregion [wand]
    permission: vnmine.command.worldedit
  vnbuild:
    description: Chọn và quản lý công trình Schema Build gần nhất
    usage: /vnbuild select
    permission: vnmine.command.schemabuild
  start:
    description: Chọn đại lục và bắt đầu hoặc tiếp tục hành trình RPG
    usage: /start
    permission: vnmine.command.start
  quatanthu:
    description: Nhận túi quà tân thủ và chọn token triệu hồi bậc 1
    usage: /quatanthu
    permission: vnmine.command.newbie-gift


