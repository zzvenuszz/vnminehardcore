# [VI] Phiên bản cấu trúc của định nghĩa đại lục; mặc định 1, chỉ hỗ trợ phiên bản 1.
# [EN] Schema version for this realm definition; defaults to 1 and only version 1 is supported.
schema-version: 1

# [VI] ID nội dung ổn định dùng để liên kết nhiệm vụ/cổng; mặc định human-realm, dùng chữ thường, số và dấu gạch nối.
# [EN] Stable content ID for quest/portal references; defaults to human-realm, lowercase letters, digits, and hyphens.
id: human-realm

# [VI] Tên hiển thị trong giao diện RPG; mặc định Nhân giới, không được để trống.
# [EN] Display name in RPG interfaces; defaults to Nhân giới and must not be blank.
display-name: "Nhân giới"

# [VI] Tên world của đại lục; có thể nhập world mới trong /vninit. Mặc định world.
# [EN] Realm world name; use /vninit to enter a new world name. Defaults to world.
world-name: world

world:
  # [VI] Nếu bật, plugin đảm bảo world được nạp lúc khởi động và áp dụng môi trường/seed; khi đổi cấu hình world cũ được lưu backup.
  # [EN] When enabled, ensure the world is loaded at startup and apply environment/seed; old world data is backed up on change.
  create-if-missing: false
  # [VI] Môi trường world: NORMAL, NETHER hoặc THE_END; đổi môi trường/seed sẽ backup thư mục cũ và tạo world mới sau restart.
  # [EN] World environment: NORMAL, NETHER, or THE_END; changing environment/seed backs up the old folder and recreates the world after restart.
  environment: NORMAL
  # [VI] /vninit tăng revision khi đổi môi trường, kể cả đổi rồi quay lại trước khi restart.
  # [EN] /vninit increments this revision on environment edits, including changes reverted before restart.
  revision: 0
  # [VI] Seed tùy chọn, số nguyên 64-bit; bỏ trống để giữ seed hiện tại, nếu xóa seed đã cấu hình thì world được tạo lại với seed tự sinh.
  # [EN] Optional 64-bit integer seed; omit to keep an existing seed; clearing a configured seed recreates the world with a generated seed.
  # seed: 123456789

# [VI] ID NPC loại tutorial đặt tại đại lục này; mặc định tutorial-guide. NPC phải được tạo trong đúng world-name.
# [EN] ID of the tutorial NPC placed in this continent; defaults to tutorial-guide. The NPC must be in world-name.
tutorial-npc-id: tutorial-guide

tutorial:
  # [VI] ID quest-dialog chạy sau khi người chơi tương tác NPC; để trống nếu không dùng.
  # [EN] Quest-dialog ID played after the player interacts with this NPC; blank disables it.
  dialog-id: ""
  # [VI] ID quest có giver NPC trùng tutorial-npc-id để giao tự động sau hội thoại.
  # [EN] Quest ID with a giver NPC matching tutorial-npc-id, automatically accepted after dialogue.
  auto-quest-id: ""

character-availability:
  # [VI] false cho phép mọi race/class hợp lệ; true chỉ hiện các ID trong allowlist bên dưới.
  # [EN] False allows all valid races/classes; true restricts to the allowlists below.
  enabled: false
  races: []
  classes: {}

# [VI] Cho phép người mới chọn đại lục này; mặc định true cho đại lục mở.
# [EN] Allow new players to choose this as their starting continent; defaults to true for an open realm.
starting-selectable: true

# [VI] World dự phòng khi world chính chưa được nạp; mặc định world. Phải là world đang được server nạp.
# [EN] Fallback world when the primary world is not loaded; defaults to world and must already be loaded.
fallback-world-name: world

access:
  # [VI] Điều kiện truy cập: default mở sẵn hoặc completed-quest cần hoàn thành quest; mặc định default.
  # [EN] Access rule: default is open, or completed-quest requires a completed quest; default is default.
  type: default

spawn:
  # [VI] Dùng điểm spawn do Paper/server cấu hình; mặc định true. Đặt false để dùng đủ x/y/z bên dưới.
  # [EN] Use the Paper/server-configured world spawn; defaults to true. Set false to provide x/y/z below.
  use-world-spawn: true

  # [VI] Hướng nhìn tại spawn; mặc định 0 độ, giới hạn yaw -360..360 và pitch -90..90.
  # [EN] Facing direction at spawn; defaults to 0 degrees, yaw range -360..360 and pitch range -90..90.
  yaw: 0
  pitch: 0

  # [VI] Tọa độ tùy chọn, chỉ cần khai báo khi use-world-spawn là false; phải nằm trong chiều cao/world border.
  # [EN] Optional coordinates, required only when use-world-spawn is false; must be within world height/border.
  # x: 0.5
  # y: 80.0
  # z: 0.5

safe-zone:
  # [VI] Bật vùng an toàn quanh spawn; mặc định true.
  # [EN] Enable the safe zone around the resolved spawn; defaults to true.
  enabled: true

  # [VI] Bán kính ngang tính bằng block; mặc định 32, giới hạn 1..1024.
  # [EN] Horizontal radius in blocks; defaults to 32, valid range 1..1024.
  radius: 32
