# [VI] Thời gian và chế độ chọn tooltip; các thiết lập đặt ở đầu file.
# [EN] Tooltip timing and selection mode; settings are defined at the top of this file.
settings:
  # [VI] Khoảng thời gian giữa các lần nhắc (giây); mặc định 300, hợp lệ 1-86400.
  # [EN] Time between reminders (seconds); default 300, valid range 1-86400.
  interval-seconds: 300
  # [VI] Cách chọn: random (ngẫu nhiên) hoặc sequential (theo thứ tự).
  # [EN] Selection mode: random or sequential.
  mode: random

# [VI] Tooltip người chơi; chỉ hiển thị hướng dẫn mà mọi người chơi đều có thể dùng.
# [EN] Player tooltips; only show instructions available to regular players.
tooltips:
  players:
    - "§eMẹo: Bấm §aF §eđể mở menu chính, rồi chọn §aNhiệm vụ§e để xem quest và tiến độ."
    - "§eMẹo: Bấm §aF §eđể mở menu nhân vật, xem kỹ năng, trang bị và VNCOIN."
    - "§eMẹo: Nói chuyện với NPC để nhận quest; quest có thể nhận sẽ hiện trong danh sách NPC."
    - "§eMẹo: Quest đã hoàn thành được lưu trong §aNhật ký nhiệm vụ§e tại menu NPC hoặc menu nhiệm vụ."
