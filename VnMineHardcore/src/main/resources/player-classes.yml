# [VI] Danh mục class RPG và trạng thái triển khai. Khóa dưới 'classes' là ID ổn định.
# [EN] RPG class catalog and implementation status. Keys under 'classes' are stable IDs.
# [VI] Mỗi chủng tộc hỗ trợ tối đa 28 class trong GUI; mỗi class chỉ thuộc một race.
# [EN] Each race supports up to 28 classes in the GUI; each class belongs to one race.
# [VI] `parent-class-id` là khóa tùy chọn (mặc định: không có); class con kế thừa skill theo ID từ class cha cùng race. Parent phải tồn tại và không tạo chu trình.
# [EN] `parent-class-id` is optional (default: absent); a child inherits skill IDs from a parent of the same race. The parent must exist and the graph must be acyclic.
# [VI] `required-level` là cấp tối thiểu để tiến vào class con (mặc định 1, hợp lệ 1-10000); chỉ áp dụng khi có parent-class-id.
# [EN] `required-level` is the minimum level for promotion into a child class (default 1, valid 1-10000); used only with parent-class-id.
# [VI] Ví dụ class con: parent-class-id: swordsman; required-level: 20. Class con cần có skill đã triển khai để xuất hiện trong GUI.
# [EN] Child example: parent-class-id: swordsman; required-level: 20. A child needs an implemented skill to appear in the GUI.
classes:
  swordsman:
    # [VI] Trạng thái: available hiển thị nếu có skill hoạt động; locked/planned bị ẩn. Thiếu khóa sẽ tự dò (auto).
    # [EN] Status: available shows only with a working skill; locked/planned stay hidden. Missing status auto-detects.
    availability: available
    # [VI] ID chủng tộc trong races.yml mà class này dành cho; bắt buộc.
    # [EN] Race ID from races.yml this class belongs to; required.
    race: human
    # [VI] Tên hiển thị; bắt buộc, không được để trống.
    # [EN] Display name; required and must not be blank.
    name: "Lính kiếm"
    # [VI] Vật phẩm Minecraft dùng làm biểu tượng; phải là Material hợp lệ.
    # [EN] Minecraft item used as the icon; must be a valid Material.
    icon: IRON_SWORD
    # [VI] Mô tả ngắn hiển thị trong GUI; bắt buộc, không được để trống.
    # [EN] Short description shown in the GUI; required and must not be blank.
    description: "Chống chịu tốt, cận chiến bền bỉ."
