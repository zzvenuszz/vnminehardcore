# ============================================================
# [WITCH BOSS] 🧙 WITCH BOSS
# ============================================================
boss-id: witch_boss
enabled: true
entity-type: WITCH
display-name: "§9§lWitch Boss"
# [VI] Class lính của token boss; bậc token theo level boss.
# [EN] Mercenary class for this boss token; token tier follows the boss level.
army-token-class: druid
# [VI] Giá bán token lính boss qua system merchant; mặc định 0 (không mua), hợp lệ 0-1000000 VNCOIN.
# [EN] System-merchant sell value for this boss summon token; default 0 (not purchasable), valid range 0-1000000 VNCOIN.
army-token-sell-value: 0
hp: 1150
damage-multiplier: 2.0
# [VI] EXP thưởng cơ bản level 1; mặc định 350, hợp lệ 1-1000000; level boss nhân theo _settings.yml.
# [EN] Base XP reward at level 1; default 350, valid range 1-1000000; boss level scaling is in _settings.yml.
experience: 350
chance: 10
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1800 = 30 phút.
# [EN] Default boss lifetime after spawning (seconds); 1800 = 30 minutes.
duration-seconds: 1800
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở (tăng theo level); số potion = level * multiply, tối đa 40.
hp-by-level:
  1: 1150
  2: 2500
  3: 4000
  4: 5500
  5: 7000
  6: 8500
  7: 9900
  8: 13000
  9: 16200
  10: 19500
# [VI] Khóa chung mỗi skill: enabled (true/false), damage (0-1024, tăng theo level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 block),
#      velocity (0.2-4), spread (0-3.14 radian). Giá trị bên dưới là mặc định.
# [EN] Common skill keys: enabled (true/false), damage (0-1024, scales by level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 blocks),
#      velocity (0.2-4), spread (0-3.14 radians). Values below are defaults.
skills:
  potion-rain:
    enabled: true
    damage: 5.0
    multiply: 1
    cooldown-seconds: 12
    radius: 4.0
    velocity: 1.0
    spread: 0.8
    # [VI] Số bình thuốc mỗi lần; mặc định 8; hợp lệ 3-16.
    # [EN] Potions per cast; default 8; valid range 3-16.
    potion-count: 8
    # [VI] Thành phần vận tốc ném lên; mặc định 0.55; hợp lệ 0.1-1.5.
    # [EN] Upward launch velocity; default 0.55; valid range 0.1-1.5.
    launch-y: 0.55
  disarm-magic:
    enabled: true
    damage: 0.0
    multiply: 1
    cooldown-seconds: 14
    radius: 4.0
    velocity: 1.2
    spread: 0.0
    # [VI] Thời gian Mệt mỏi khai thác (tick); mặc định 80; hợp lệ 20-200.
    # [EN] Mining Fatigue duration (ticks); default 80; valid range 20-200.
    fatigue-ticks: 80

# [VI] Trait dùng khóa enabled; mặc định bật, chỉ nhận true hoặc false.
# [EN] Traits use enabled; on by default and accepts true or false.
traits:
  witchcraft-drain:
    enabled: true
    # [VI] Tỷ lệ máu hút lại từ sát thương hiệu ứng; mặc định 0.5; hợp lệ 0-1.
    # [EN] Healing fraction from qualifying effect damage; default 0.5; valid range 0-1.
    heal-percent: 0.5
    # [VI] Bán kính kích hoạt hút máu (block); mặc định 16; hợp lệ 1-64.
    # [EN] Healing trigger radius (blocks); default 16; valid range 1-64.
    radius: 5.0

immunities:
  poison: true
  potion-effects:
    - WEAKNESS

