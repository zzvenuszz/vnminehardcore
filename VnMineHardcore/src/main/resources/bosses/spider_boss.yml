# ============================================================
# [SPIDER BOSS] 🕷️ SPIDER BOSS
# ============================================================
boss-id: spider_boss
enabled: true
entity-type: SPIDER
display-name: "§0§lSpider Boss"
# [VI] Class lính của token boss; bậc token theo level boss.
# [EN] Mercenary class for this boss token; token tier follows the boss level.
army-token-class: assassin
hp: 900
damage-multiplier: 1.8
# [VI] Sát thương tối đa mỗi hit skill lên người chơi trước giảm giáp và hệ số combat chung; mặc định 5, hợp lệ 0-100.
# [EN] Maximum skill damage per hit to players before armor and the global combat multiplier; default 5, valid 0-100.
max-player-hit-damage: 5.0
# [VI] EXP thưởng cơ bản level 1; mặc định 250, hợp lệ 1-1000000; level boss nhân theo _settings.yml.
# [EN] Base XP reward at level 1; default 250, valid range 1-1000000; boss level scaling is in _settings.yml.
experience: 250
chance: 20
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1800 = 30 phút.
# [EN] Default boss lifetime after spawning (seconds); 1800 = 30 minutes.
duration-seconds: 1800
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở và tăng theo level; multiply cấu hình số lần/độ mạnh skill.
hp-by-level:
  1: 900
  2: 2100
  3: 3500
  4: 4900
  5: 6300
  6: 7700
  7: 9100
  8: 11900
  9: 14800
  10: 17700
# [VI] Khóa chung mỗi skill: enabled (true/false), damage (0-1024, tăng theo level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 block),
#      velocity (0.2-4), spread (0-3.14 radian). Giá trị bên dưới là mặc định.
# [EN] Common skill keys: enabled (true/false), damage (0-1024, scales by level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 blocks),
#      velocity (0.2-4), spread (0-3.14 radians). Values below are defaults.
skills:
  venom-web:
    enabled: true
    damage: 4.0
    multiply: 1
    cooldown-seconds: 10
    radius: 5.0
    velocity: 1.0
    spread: 0.0
  cobweb-trap:
    enabled: true
    damage: 0.0
    multiply: 1
    cooldown-seconds: 14
    radius: 4.0
    velocity: 1.2
    spread: 0.0
    # [VI] Bán kính bẫy (1 tạo vùng 3x3); mặc định 1; hợp lệ 1-2.
    # [EN] Trap radius (1 creates a 3x3 area); default 1; valid range 1-2.
    trap-radius: 1
    # [VI] Thời gian tơ tồn tại (giây); mặc định 6; hợp lệ 1-30.
    # [EN] Cobweb lifetime (seconds); default 6; valid range 1-30.
    trap-duration-seconds: 6
  venom-pounce:
    enabled: true
    damage: 7.0
    multiply: 1
    cooldown-seconds: 12
    radius: 3.0
    velocity: 1.2
    spread: 0.0
    # [VI] Vận tốc nhảy dọc; mặc định 0.75; hợp lệ 0.3-1.5.
    # [EN] Vertical jump velocity; default 0.75; valid range 0.3-1.5.
    jump-y: 0.75

# [VI] Trait dùng khóa enabled; mặc định bật, chỉ nhận true hoặc false.
# [EN] Traits use enabled; on by default and accepts true or false.
traits:
  brood-release:
    enabled: true
    # [VI] Ngưỡng máu triệu hồi; mặc định 0.5 (50%); hợp lệ 0.1-0.9.
    # [EN] Health threshold for summoning; default 0.5 (50%); valid range 0.1-0.9.
    health-threshold: 0.5
    # [VI] Số nhện con ít nhất; mặc định 4; hợp lệ 1-8.
    # [EN] Minimum Cave Spider minions; default 4; valid range 1-8.
    minions-min: 4
    # [VI] Số nhện con nhiều nhất; mặc định 6; hợp lệ minions-min..8.
    # [EN] Maximum Cave Spider minions; default 6; valid range minions-min..8.
    minions-max: 6

immunities:
  potion-effects:
    - SLOWNESS

drops:
  STRING:
    min-amount: 15
    max-amount: 35
    chance: 0.30
  SPIDER_EYE:
    min-amount: 5
    max-amount: 12
    chance: 0.30
  DIAMOND:
    min-amount: 3
    max-amount: 6
    chance: 0.30
  IRON_INGOT:
    min-amount: 8
    max-amount: 15
    chance: 0.30
  EMERALD:
    min-amount: 5
    max-amount: 12
    chance: 0.30
  COBWEB:
    min-amount: 3
    max-amount: 8
    chance: 0.30
  ENCHANTED_BOOK:
    min-amount: 1
    max-amount: 1
    chance: 0.30
  FERMENTED_SPIDER_EYE:
    min-amount: 1
    max-amount: 3
    chance: 0.30

# [VI] Loot quý theo level; level thiếu dùng mốc gần nhất thấp hơn. amount: 1-64, chance: 0.0-1.0.
# [EN] Rare drops by level; missing tiers inherit the nearest lower tier. amount: 1-64, chance: 0.0-1.0.
# [VI] enchantments áp dụng trực tiếp; book-enchantments lưu enchant để áp dụng lên vật phẩm.
# [EN] enchantments apply to the item; book-enchantments are stored for applying to another item.
# [VI] Mỗi cấp có một di vật riêng; số dòng enchant tăng đúng theo level (1-10).
#      Số lượng hợp lệ 1-64; chance 0-1; cấp enchant 1-255.
#      Lore gồm truyền thuyết theo boss và tối đa 4 dòng cho mỗi vật phẩm.
#      Với cung, từ cấp 8 dùng sách phù phép để giữ đủ dòng enchant tương thích.
# [EN] Each tier has a unique relic; enchantment lines increase with level (1-10).
#      Valid amount 1-64, chance 0-1, and enchantment level 1-255.
#      Each item's lore tells the boss-specific legend in at most 4 lines.
#      Bow relics use enchanted books from tier 8 to preserve compatible enchantments.
# [VI] Tạo bộ giáp bốn món cho boss này; vật liệu và enchant tự tăng theo level.
# [EN] Generate this boss's four-piece armor set; materials and enchants scale by level.
armor-set:
  # [VI] Bật/tắt bộ giáp; mặc định true.
  # [EN] Enable or disable the armor set; default true.
  enabled: true
  # [VI] Tên bộ giáp dùng cho mũ, áo, quần và ủng.
  # [EN] Armor set name prefix used by the helmet, chestplate, leggings, and boots.
  name: "§0§lGiáp Tơ Hoàng Hôn"
  # [VI] ID lore trong story.yml; phải trỏ tới một mục artifacts hợp lệ.
  # [EN] Lore ID in story.yml; must reference a valid artifacts entry.
  story-id: spider-armor
  # [VI] Mốc cấp tối thiểu cho vật liệu; từ 1 sắt, 4 kim cương, 7 netherite.
  # [EN] Minimum level for each material tier; iron at 1, diamond at 4, netherite at 7.
  material-tiers:
    1: IRON
    4: DIAMOND
    7: NETHERITE

