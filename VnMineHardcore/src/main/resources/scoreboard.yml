# [VI] Cấu hình mùa xếp hạng boss và quà thưởng.
# [EN] Configure boss leaderboard seasons and rewards.

# [VI] Bật hệ thống bảng xếp hạng và phát thưởng; mặc định true.
# [EN] Enable leaderboard and reward seasons; default true.
enabled: true

scoreboard:
  # [VI] Bật sidebar hiển thị sát thương boss/điểm mùa; mặc định true.
  # [EN] Show boss damage/season points in the sidebar; default true.
  enabled: true
  # [VI] Tiêu đề sidebar; mặc định "§6§lBOSS RANKING".
  # [EN] Sidebar title; default "§6§lBOSS RANKING".
  title: "§6§lBOSS RANKING"
  # [VI] Bật các thông tin cơ bản của người chơi ở đầu sidebar; mặc định bật.
  # [EN] Show basic player information at the top of the sidebar; enabled by default.
  player-info:
    enabled: true
    # [VI] Hiển thị tên người chơi; mặc định bật.
    # [EN] Show the player's name; enabled by default.
    show-name: true
    # [VI] Hiển thị cấp RPG (hoặc cấp vanilla khi hồ sơ đang tải); mặc định bật.
    # [EN] Show RPG level (or vanilla level while the profile loads); enabled by default.
    show-level: true
    # [VI] Hiển thị máu hiện tại/tối đa; mặc định bật.
    # [EN] Show current/maximum health; enabled by default.
    show-health: true
    # [VI] Hiển thị tên world hiện tại; mặc định bật.
    # [EN] Show the current world name; enabled by default.
    show-world: true
    # [VI] Hiển thị race/class trong hồ sơ RPG; mặc định bật.
    # [EN] Show the race/class from the RPG profile; enabled by default.
    show-character: true

reset:
  # [VI] Số ngày trong game giữa các lần reset; mặc định 100, hợp lệ 1-100000.
  # [EN] In-game days between resets; default 100, valid range 1-100000.
  every-game-days: 100
  # [VI] Số giây hiển thị title chúc mừng người đứng đầu; mặc định 10, hợp lệ 1-60.
  # [EN] Seconds to show the winner title; default 10, valid range 1-60.
  winner-title-seconds: 10

rewards:
  # [VI] Nhắc người chơi đang online nhận quà theo chu kỳ phút; mặc định 60, hợp lệ 1-10080.
  # [EN] Reminder interval in minutes for online players with pending rewards; default 60, valid range 1-10080.
  reminder-interval-minutes: 60

  # [VI] Mỗi vật phẩm có enabled, material, amount, name/lore tùy chọn và enchantments tùy chọn.
  #      Enchantments dùng ID như sharpness, unbreaking; level 1-255, vượt giới hạn vanilla sẽ over-enchant.
  # [EN] Each item supports enabled, material, amount, optional name/lore and optional enchantments.
  #      Use IDs such as sharpness, unbreaking; levels 1-255, levels above vanilla limits are over-enchants.
  # [VI] Pool bổ sung cho mỗi top-N: danh sách khoảng 20 map {material, amount, enabled?, name?}; mặc định enabled=true, mỗi mùa chọn đúng một món ngẫu nhiên.
  #      material phải hợp lệ, amount từ 1 đến max stack của vật phẩm, name là tên hiển thị tùy chọn.
  # [EN] Each top-N can define a pool of about 20 maps {material, amount, enabled?, name?}; enabled defaults to true and one item is randomly selected per season.
  #      material must be valid, amount must be 1 through the item's max stack size, and name is optional.
  top-1:
    netherite-sword:
      # [VI] Bật/tắt riêng vật phẩm mẫu; mặc định true.
      # [EN] Enable/disable this sample item; default true.
      enabled: true
      # [VI] Vật phẩm phần thưởng; mặc định NETHERITE_SWORD.
      # [EN] Reward material; default NETHERITE_SWORD.
      material: NETHERITE_SWORD
      # [VI] Số lượng vật phẩm; mặc định 1, hợp lệ 1 đến giới hạn stack của vật phẩm.
      # [EN] Item amount; default 1, valid from 1 to the material stack limit.
      amount: 1
      # [VI] Tên riêng; mặc định "§6§lKẻ Săn Boss".
      # [EN] Custom item name; default "§6§lKẻ Săn Boss".
      name: "§6§lKẻ Săn Boss"
      # [VI] Lore riêng của vật phẩm.
      # [EN] Custom item lore.
      lore:
        - "§ePhần thưởng Top 1"
        - "§7Mùa giải Boss"
      # [VI] Enchant có thể vượt cấp tối đa vanilla.
      # [EN] Enchantments may exceed vanilla maximum levels.
      enchantments:
        sharpness: 7
        unbreaking: 5
    diamonds:
      # [VI] Bật/tắt riêng vật phẩm mẫu; mặc định true.
      # [EN] Enable/disable this sample item; default true.
      enabled: true
      # [VI] Vật phẩm phần thưởng; mặc định DIAMOND.
      # [EN] Reward material; default DIAMOND.
      material: DIAMOND
      # [VI] Số lượng; mặc định 32, hợp lệ 1-64.
      # [EN] Amount; default 32, valid range 1-64.
      amount: 32
